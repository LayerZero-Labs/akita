name: Documentation guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]

permissions:
  contents: read

jobs:
  guardrails:
    name: Doc guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install ripgrep
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # ripgrep
        with:
          tool: ripgrep

      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1

      - name: Install mdbook toolchain (0.4.x)
        run: |
          cargo install mdbook --version 0.4.52 --locked
          cargo install mdbook-katex --version 0.9.4 --locked
          cargo install mdbook-mermaid --version 0.14.1 --locked
          mdbook-mermaid install book

      - name: Run documentation guardrails
        run: ./scripts/check-doc-guardrails.sh

      - name: Test blast-radius script
        run: python3 scripts/tests/test_doc_blast_radius.py

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy:
    name: Deploy Akita Book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
