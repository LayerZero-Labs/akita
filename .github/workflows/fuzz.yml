name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: ["**", main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: 60
  FUZZ_TARGET: x86_64-unknown-linux-gnu
  # Warnings stay errors, except deprecations: nightly deprecates std APIs
  # (for example `fetch_update`) whose replacements the workspace's stable
  # toolchain does not have yet.
  RUSTFLAGS: -A deprecated

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz Akita targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # cargo-fuzz
        with:
          tool: cargo-fuzz
      # Cargo in fuzz/ uses the nightly pinned in fuzz/rust-toolchain.toml, the
      # one campaigns build with. The end-to-end harness is only type-checked
      # here; the runner does not link Akita, so its tests are cheap.
      - name: Check the fuzz crates
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check -q --workspace --all-targets
          cargo test -q --release -p akita-fuzz-runner
      # End-to-end and boundary targets that prove need minutes of setup per
      # process and more memory than this runner has; they run in long
      # campaigns (fuzz/README.md). CI builds without the `end-to-end` feature
      # and fuzzes every lane the registry marks `ci` briefly.
      - name: Fuzz CI targets
        working-directory: fuzz
        run: |
          set -euo pipefail
          # One line per lane: the cargo-fuzz binary, then the lane's variant
          # environment (for example the scalar NTT lane of ring_ntt).
          lanes=$(cargo run --release -q -p akita-fuzz-runner -- targets --ci --cargo-fuzz)
          if [ -z "$lanes" ]; then
            echo "No CI fuzz targets found"
            exit 1
          fi
          while read -r binary envs; do
            echo "--- Fuzzing $binary ${envs} for ${FUZZ_DURATION}s ---"
            # shellcheck disable=SC2086 # envs is a list of KEY=VALUE words
            env $envs cargo fuzz run --release --debug-assertions --no-default-features --features parallel --target "${FUZZ_TARGET}" "$binary" -- -max_total_time="${FUZZ_DURATION}" < /dev/null
          done <<< "$lanes"
