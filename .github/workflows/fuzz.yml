name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: ["**", main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: 60
  FUZZ_TARGET: x86_64-unknown-linux-gnu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz Akita targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # cargo-fuzz
        with:
          tool: cargo-fuzz
      # End-to-end and boundary targets need minutes of setup per process and
      # more memory than this runner has; they run in long campaigns
      # (fuzz/README.md). CI fuzzes the primitive targets briefly.
      - name: Fuzz primitive targets
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets=$(cargo run --release -q -p akita-fuzz-runner -- targets | awk '$2 == "primitive" { print $1 }')
          if [ -z "$targets" ]; then
            echo "No primitive fuzz targets found"
            exit 1
          fi
          for target in $targets; do
            echo "--- Fuzzing $target for ${FUZZ_DURATION}s ---"
            cargo +nightly fuzz run --release --debug-assertions --target "${FUZZ_TARGET}" "$target" -- -max_total_time="${FUZZ_DURATION}"
          done
