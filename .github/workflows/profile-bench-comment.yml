name: Akita Profile Benchmarks Comment

on:
  workflow_run:
    workflows: ["Akita Profile Benchmarks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

env:
  AKITA_BENCH_ARTIFACT_NAME: profile-bench-data
  AKITA_REPORT_MAX_ARTIFACT_BYTES: "5000000"
  AKITA_REPORT_MAX_INPUT_BYTES: "2000000"
  AKITA_REPORT_MAX_BODY_BYTES: "60000"
  AKITA_BENCH_MARKER: "<!-- akita-profile-bench-report -->"

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve PR number
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_comment_workflow.py resolve-pr

      - name: Resolve bounded benchmark artifact
        if: steps.pr.outputs.issue-number != ''
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python3 scripts/ci_comment_workflow.py resolve-artifact
          --run-id "$AKITA_REPORT_RUN_ID"
          --name "$AKITA_BENCH_ARTIFACT_NAME"
          --max-bytes "$AKITA_REPORT_MAX_ARTIFACT_BYTES"
          --expected-head-sha "$AKITA_REPORT_HEAD_SHA"

      - name: Download benchmark data artifact
        if: steps.artifact.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/profile-bench-artifact
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Authenticate benchmark baseline identities
        if: steps.artifact.outputs.artifact-id != ''
        id: baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_PR_NUMBER: ${{ steps.pr.outputs.issue-number }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_HEAD_REPOSITORY: ${{ steps.pr.outputs.head-repository }}
          AKITA_REPORT_HEAD_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_REPORT_BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          AKITA_REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
          AKITA_REPORT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          AKITA_BENCH_INPUT: ${{ runner.temp }}/profile-bench-artifact
        run: >-
          python3 scripts/ci_comment_workflow.py resolve-profile-baselines
          --metadata "$AKITA_BENCH_INPUT/baseline-metadata.json"
          --main-summary "$AKITA_BENCH_INPUT/main-baseline/summary.json"
          --previous-summary "$AKITA_BENCH_INPUT/previous-baseline/summary.json"
          --current-run-id "$AKITA_REPORT_RUN_ID"
          --workflow-name "$AKITA_REPORT_WORKFLOW_NAME"
          --artifact-name "$AKITA_BENCH_ARTIFACT_NAME"
          --head-sha "$AKITA_REPORT_HEAD_SHA"
          --head-repository "$AKITA_REPORT_HEAD_REPOSITORY"
          --head-branch "$AKITA_REPORT_HEAD_BRANCH"
          --pr-number "$AKITA_REPORT_PR_NUMBER"
          --base-sha "$AKITA_REPORT_BASE_SHA"
          --max-input-bytes "$AKITA_REPORT_MAX_INPUT_BYTES"
          --max-artifact-bytes "$AKITA_REPORT_MAX_ARTIFACT_BYTES"

      - name: Render benchmark comment with trusted code
        if: steps.artifact.outputs.artifact-id != ''
        env:
          AKITA_BENCH_SOURCE_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_BENCH_SOURCE_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_BENCH_MAIN_BASELINE_SHA: ${{ steps.baselines.outputs.main-sha }}
          AKITA_BENCH_PREVIOUS_BASELINE_SHA: ${{ steps.baselines.outputs.previous-sha }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AKITA_BENCH_RESULT: ${{ github.event.workflow_run.conclusion }}
          AKITA_BENCH_INPUT: ${{ runner.temp }}/profile-bench-artifact
          AKITA_BENCH_COMMENT: ${{ runner.temp }}/profile-bench-comment.md
        run: |
          summary_path="$AKITA_BENCH_INPUT/summary.json"
          if [ ! -f "$summary_path" ]; then
            echo "::warning::Benchmark artifact has no structured summary.json."
            exit 0
          fi
          main_baseline_dir=""
          previous_baseline_dir=""
          if [ -n "$AKITA_BENCH_MAIN_BASELINE_SHA" ]; then
            main_baseline_dir="$AKITA_BENCH_INPUT/main-baseline"
            export AKITA_BENCH_MAIN_BASELINE_LABEL='the merge-base benchmarked on this runner'
          fi
          if [ -n "$AKITA_BENCH_PREVIOUS_BASELINE_SHA" ]; then
            previous_baseline_dir="$AKITA_BENCH_INPUT/previous-baseline"
            export AKITA_BENCH_PREVIOUS_BASELINE_LABEL='the previous PR update with a benchmark artifact'
          fi
          python3 scripts/ci_comment_workflow.py check-files \
            --max-bytes "$AKITA_REPORT_MAX_INPUT_BYTES" \
            "$summary_path"
          if [ -n "$main_baseline_dir" ]; then
            python3 scripts/ci_comment_workflow.py check-files \
              --max-bytes "$AKITA_REPORT_MAX_INPUT_BYTES" \
              "$main_baseline_dir/summary.json"
          fi
          if [ -n "$previous_baseline_dir" ]; then
            python3 scripts/ci_comment_workflow.py check-files \
              --max-bytes "$AKITA_REPORT_MAX_INPUT_BYTES" \
              "$previous_baseline_dir/summary.json"
          fi
          python3 scripts/profile_bench_report.py render \
            "$summary_path" \
            --main-baseline-dir "$main_baseline_dir" \
            --previous-baseline-dir "$previous_baseline_dir" \
            --compact > "$AKITA_BENCH_COMMENT.body.raw"
          if [ -n "$AKITA_BENCH_PREVIOUS_BASELINE_SHA" ]; then
            previous_short="${AKITA_BENCH_PREVIOUS_BASELINE_SHA:0:7}"
            inserted=false
            while IFS= read -r line; do
              printf '%s\n' "$line"
              place_identity=false
              if [[ "$line" == '- Merge base:'* ]]; then
                place_identity=true
              elif [ -z "$AKITA_BENCH_MAIN_BASELINE_SHA" ] && [[ "$line" == '- Head:'* ]]; then
                place_identity=true
              fi
              if [ "$inserted" = false ] && [ "$place_identity" = true ]; then
                printf -- '- Prior PR run: [`%s`](https://github.com/%s/commit/%s) from %s.\n' \
                  "$previous_short" \
                  "$GITHUB_REPOSITORY" \
                  "$AKITA_BENCH_PREVIOUS_BASELINE_SHA" \
                  "$AKITA_BENCH_PREVIOUS_BASELINE_LABEL"
                inserted=true
              fi
            done < "$AKITA_BENCH_COMMENT.body.raw" > "$AKITA_BENCH_COMMENT.body"
            if [ "$inserted" = false ]; then
              echo "::warning::Could not place the authenticated prior-run identity."
              exit 1
            fi
          else
            mv "$AKITA_BENCH_COMMENT.body.raw" "$AKITA_BENCH_COMMENT.body"
          fi
          {
            echo "$AKITA_BENCH_MARKER"
            echo
            if [ "$AKITA_BENCH_RESULT" != "success" ]; then
              echo '> [!WARNING]'
              echo '> One or more benchmark cases failed; this report contains only available structured results.'
              echo
            fi
            cat "$AKITA_BENCH_COMMENT.body"
          } > "$AKITA_BENCH_COMMENT"

      - name: Revalidate head and upsert benchmark PR comment
        if: steps.artifact.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_PR_NUMBER: ${{ steps.pr.outputs.issue-number }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_HEAD_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_REPORT_HEAD_REPOSITORY: ${{ steps.pr.outputs.head-repository }}
          AKITA_REPORT_BASE_REPOSITORY: ${{ steps.pr.outputs.base-repository }}
          AKITA_REPORT_BASE_BRANCH: ${{ steps.pr.outputs.base-branch }}
          AKITA_REPORT_BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          AKITA_REPORT_COMMENT: ${{ runner.temp }}/profile-bench-comment.md
        run: >-
          python3 scripts/ci_comment_workflow.py upsert-comment
          --pr-number "$AKITA_REPORT_PR_NUMBER"
          --head-sha "$AKITA_REPORT_HEAD_SHA"
          --head-branch "$AKITA_REPORT_HEAD_BRANCH"
          --head-repository "$AKITA_REPORT_HEAD_REPOSITORY"
          --base-repository "$AKITA_REPORT_BASE_REPOSITORY"
          --base-branch "$AKITA_REPORT_BASE_BRANCH"
          --base-sha "$AKITA_REPORT_BASE_SHA"
          --comment "$AKITA_REPORT_COMMENT"
          --marker "$AKITA_BENCH_MARKER"
          --max-bytes "$AKITA_REPORT_MAX_BODY_BYTES"
