name: Akita Profile Benchmarks Comment

on:
  workflow_run:
    workflows: ["Akita Profile Benchmarks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  AKITA_BENCH_ARTIFACT_NAME: profile-bench-data

jobs:
  comment:
    # `report` uploads the artifact on !cancelled, so forks also get the comment
    # on partial-failure runs (comment.md already carries the warning banner +
    # passing cases). Download below tolerates a missing artifact.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            let prs = workflowRun.pull_requests || [];

            // GitHub leaves workflow_run.pull_requests empty for cross-fork
            // pull_request runs. Resolve those runs from their immutable head
            // identity, and refuse to guess when the result is ambiguous.
            if (prs.length === 0) {
              const { owner, repo } = context.repo;
              const headOwner = workflowRun.head_repository?.owner?.login;
              const headRepository = workflowRun.head_repository?.full_name;
              const headBranch = workflowRun.head_branch;
              const headSha = workflowRun.head_sha;

              if (!headOwner || !headRepository || !headBranch || !headSha) {
                core.warning('Cross-fork workflow run is missing head identity metadata.');
                core.setOutput('issue-number', '');
                return;
              }

              const candidates = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'open',
                  head: `${headOwner}:${headBranch}`,
                  per_page: 100,
                }
              );
              const expectedBaseRepository = `${owner}/${repo}`.toLowerCase();
              const expectedHeadRepository = headRepository.toLowerCase();
              prs = candidates.filter(candidate =>
                candidate.head?.sha === headSha &&
                candidate.head?.repo?.full_name?.toLowerCase() === expectedHeadRepository &&
                candidate.base?.repo?.full_name?.toLowerCase() === expectedBaseRepository
              );

              if (prs.length !== 1) {
                core.warning(
                  `Expected exactly one open PR for ${headRepository}:${headBranch}@${headSha}; ` +
                  `found ${prs.length}.`
                );
                core.setOutput('issue-number', '');
                return;
              }

              core.info(`Resolved cross-fork workflow run to PR #${prs[0].number}.`);
            } else if (prs.length !== 1) {
              core.warning(`Expected exactly one associated PR; found ${prs.length}.`);
              core.setOutput('issue-number', '');
              return;
            }

            core.setOutput('issue-number', String(prs[0].number));

      - name: Download benchmark artifact
        if: steps.pr.outputs.issue-number != ''
        # Only a total build failure leaves no artifact; the upsert step no-ops
        # on a missing file, so don't fail the job.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.AKITA_BENCH_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/profile-bench-artifact
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Upsert benchmark PR comment
        if: steps.pr.outputs.issue-number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AKITA_BENCH_COMMENT: ${{ runner.temp }}/profile-bench-artifact/comment.md
          AKITA_BENCH_ISSUE_NUMBER: ${{ steps.pr.outputs.issue-number }}
        with:
          script: |
            const fs = require('fs');
            const commentPath = process.env.AKITA_BENCH_COMMENT;
            if (!fs.existsSync(commentPath)) {
              core.warning('No benchmark comment body found in benchmark artifact.');
              return;
            }

            const marker = '<!-- akita-profile-bench-report -->';
            const maxBodyBytes = 60_000;
            const body = fs.readFileSync(commentPath, 'utf8');
            if (!body.startsWith(marker)) {
              core.warning('Benchmark comment is missing the required report marker.');
              return;
            }
            if (Buffer.byteLength(body, 'utf8') > maxBodyBytes) {
              core.warning(`Benchmark comment exceeds the ${maxBodyBytes}-byte policy limit.`);
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.AKITA_BENCH_ISSUE_NUMBER);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              const response = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark PR comment: ${response.data.html_url}`);
            } else {
              const response = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created benchmark PR comment: ${response.data.html_url}`);
            }
