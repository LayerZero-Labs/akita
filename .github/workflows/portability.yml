name: Portability

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-x86:
    name: Portable x86 verifier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Check verifier with portable CPU target
        run: RUSTFLAGS="-D warnings -C target-cpu=x86-64" cargo check --release -p akita-verifier --no-default-features --features transcript-blake2b
      - name: Test exact-cache boundary
        run: |
          cargo test --release -p akita-types --lib ntt_cache
          cargo test --release -p akita-verifier --lib terminal::ntt::

  aarch64-neon:
    name: Native AArch64 NEON kernels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Require native AArch64 NEON
        run: |
          test "$(uname -m)" = "aarch64"
          grep -Eq '(^|[[:space:]])(asimd|neon)([[:space:]]|$)' /proc/cpuinfo
      - name: Run architecture-specific exact NTT, wide-mass and window-gather tests
        env:
          RUSTFLAGS: -D warnings -C target-cpu=native
        run: |
          cargo test --release -p akita-algebra --lib ntt
          cargo test --release -p akita-types --lib ntt_cache
          cargo test --release -p akita-verifier --lib terminal::ntt::
          cargo test --release -p akita-cpu-backend --lib wide_mass::tests
          cargo test --release -p akita-cpu-backend --lib windowed_accum::tests
          cargo test --release -p akita-cpu-backend --lib poly_helpers::tests::partitioned_fold

  x86-avx2:
    name: Native x86-64 AVX2 kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Detect native AVX2
        id: cpu
        run: |
          test "$(uname -m)" = "x86_64"
          if grep -Eq '(^|[[:space:]])avx2([[:space:]]|$)' /proc/cpuinfo; then
            echo "avx2=true" >> "$GITHUB_OUTPUT"
          else
            echo "avx2=false" >> "$GITHUB_OUTPUT"
            echo "::warning::runner has no AVX2; skipping the AVX2 window-gather tests"
          fi
      # The window-gather kernel is selected by compile-time target features,
      # so the test binary only runs on a CPU that has them.
      - name: Run AVX2 window-gather tests
        if: steps.cpu.outputs.avx2 == 'true'
        env:
          RUSTFLAGS: -D warnings -C target-feature=+avx2
        run: |
          cargo test --release -p akita-cpu-backend --lib windowed_accum::tests
          cargo test --release -p akita-cpu-backend --lib poly_helpers::tests::partitioned_fold

  avx512-ifma:
    name: AVX-512 IFMA exact NTT (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install Intel Software Development Emulator
        run: |
          curl --fail --location --silent --show-error --output /tmp/intel-sde.tar.xz https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo '94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  /tmp/intel-sde.tar.xz' | sha256sum --check
          sudo mkdir --parents /opt/intel-sde
          sudo tar --extract --xz --file /tmp/intel-sde.tar.xz --strip-components=1 --directory /opt/intel-sde
          sudo sysctl --write kernel.yama.ptrace_scope=0
      - name: Run IFMA tests under emulation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /opt/intel-sde/sde64 -icx --
        run: |
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-algebra --lib ifma52 -- --include-ignored
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-algebra --lib ntt::avx -- --include-ignored
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-types --lib ifma -- --include-ignored
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-verifier --lib terminal::ntt::
      # The emulated CPU always has AVX-512BW, which the two-window gather is
      # compiled for, so this step never depends on the runner's hardware.
      - name: Run AVX-512BW window-gather tests under emulation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /opt/intel-sde/sde64 -icx --
          RUSTFLAGS: -D warnings -C target-feature=+avx2,+avx512bw
        run: |
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-cpu-backend --lib windowed_accum::tests
          cargo test --profile ci-test --target x86_64-unknown-linux-gnu -p akita-cpu-backend --lib poly_helpers::tests::partitioned_fold

  wasm-serialization:
    name: Wasm serialization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check serialization on wasm
        run: cargo check --release -p akita-serialization --target wasm32-unknown-unknown
