name: Portability

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-x86:
    name: Portable x86 verifier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - name: Check verifier with portable CPU target
        run: RUSTFLAGS="-D warnings -C target-cpu=x86-64" cargo check --release -p akita-verifier --no-default-features --features transcript-blake2b
      - name: Test exact-cache boundary
        run: |
          cargo test --release -p akita-types --lib ntt_cache
          cargo test --release -p akita-verifier --lib terminal_ntt

  aarch64-neon:
    name: Native AArch64 NEON exact NTT
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - name: Require native AArch64 NEON
        run: |
          test "$(uname -m)" = "aarch64"
          grep -Eq '(^|[[:space:]])(asimd|neon)([[:space:]]|$)' /proc/cpuinfo
      - name: Run architecture-specific exact NTT and JL tests
        env:
          RUSTFLAGS: -D warnings -C target-cpu=native --cfg aes_armv8
        run: |
          cargo test --release -p akita-algebra --lib ntt
          cargo test --release -p akita-algebra --lib jl
          cargo test --release -p akita-challenges --lib jl
          cargo test --release -p akita-types --lib ntt_cache
          cargo test --release -p akita-verifier --lib terminal_ntt

  avx512-ifma:
    name: AVX-512 IFMA exact NTT (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - name: Install Intel Software Development Emulator
        run: |
          curl --fail --location --silent --show-error --output /tmp/intel-sde.tar.xz https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo '94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  /tmp/intel-sde.tar.xz' | sha256sum --check
          sudo mkdir --parents /opt/intel-sde
          sudo tar --extract --xz --file /tmp/intel-sde.tar.xz --strip-components=1 --directory /opt/intel-sde
          sudo sysctl --write kernel.yama.ptrace_scope=0
      - name: Run IFMA tests under emulation
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /opt/intel-sde/sde64 -icx --
        run: |
          cargo test --release --target x86_64-unknown-linux-gnu -p akita-algebra --lib ifma52 -- --include-ignored
          cargo test --release --target x86_64-unknown-linux-gnu -p akita-types --lib ifma -- --include-ignored
          cargo test --release --target x86_64-unknown-linux-gnu -p akita-verifier --lib terminal_ntt

  wasm-serialization:
    name: Wasm serialization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check serialization on wasm
        run: cargo check --release -p akita-serialization --target wasm32-unknown-unknown
