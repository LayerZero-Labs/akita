name: AI PR review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, edited, reopened]

permissions: {}

concurrency:
  # One queue per PR and event type, so PR invalidation is never displaced by a
  # comment run. GitHub keeps one pending run per group, so comments other than
  # the author's exact command get a group of their own and cannot replace a
  # queued review request.
  group: >-
    ai-review-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{
    (github.event_name != 'issue_comment' || (github.event.comment.body == '/ai-review' &&
    github.event.comment.user.id == github.event.issue.user.id)) && 'queue' || github.run_id }}
  cancel-in-progress: false

jobs:
  invalidate-approval:
    if: github.repository == 'LayerZero-Labs/akita' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-review-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Trusted main scripts only; never check out the PR or use a model key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: scripts/ai_review
      - name: Reconcile approval against the latest verified review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ai_review/run.py reconcile --directory "$RUNNER_TEMP/ai-review"

  reserve:
    if: >-
      github.event_name == 'issue_comment' &&
      github.run_attempt == 1 &&
      github.repository == 'LayerZero-Labs/akita' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/ai-review' &&
      github.event.comment.user.id == github.event.issue.user.id &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ready: ${{ steps.reserve.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize and reserve one of three attempts
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ai_review/run.py reserve --directory "$RUNNER_TEMP/ai-review"

  collect:
    needs: reserve
    if: needs.reserve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.collect.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Authorize and collect pinned source
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ai_review/run.py collect --directory "$RUNNER_TEMP/ai-review"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.collect.outputs.ready == 'true'
        with:
          name: ai-review-snapshot
          path: ${{ runner.temp }}/ai-review/snapshot.json
          retention-days: 1
          if-no-files-found: error

  review:
    needs: collect
    if: github.run_attempt == 1 && needs.collect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: non-main
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-snapshot
          path: ${{ runner.temp }}/ai-review
      - name: Review through bounded source tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'gpt-6-astra' }}
        run: python3 scripts/ai_review/run.py review --directory "$RUNNER_TEMP/ai-review"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-result
          path: ${{ runner.temp }}/ai-review/result.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [collect, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The outer event queues admit at most one publisher and one reconciler,
    # so this shared lock has at most one pending job (no replacement).
    concurrency:
      group: ai-review-labels-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-snapshot
          path: ${{ runner.temp }}/ai-review
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-result
          path: ${{ runner.temp }}/ai-review
      - name: Revalidate request and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ai_review/run.py publish --directory "$RUNNER_TEMP/ai-review"

  cleanup:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No source checkout, model key or PR-write permission in this job.
      - name: Delete review artifacts after successful publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (!['ai-review-snapshot', 'ai-review-result'].includes(artifact.name)) continue;
              try {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
