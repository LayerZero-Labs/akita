name: Akita CI Test Timing Comment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

env:
  AKITA_TEST_TIMING_ARTIFACT_NAME: ci-test-timing-data
  AKITA_TEST_TIMING_MARKER: "<!-- akita-ci-test-timing -->"
  AKITA_REPORT_MAX_ARTIFACT_BYTES: "5000000"
  AKITA_REPORT_MAX_INPUT_BYTES: "2000000"
  AKITA_REPORT_MAX_BODY_BYTES: "60000"

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve PR number
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_comment_workflow.py resolve-pr

      - name: Resolve bounded current timing artifact
        if: steps.pr.outputs.issue-number != ''
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python3 scripts/ci_comment_workflow.py resolve-artifact
          --run-id "$AKITA_REPORT_RUN_ID"
          --name "$AKITA_TEST_TIMING_ARTIFACT_NAME"
          --max-bytes "$AKITA_REPORT_MAX_ARTIFACT_BYTES"
          --expected-head-sha "$AKITA_REPORT_HEAD_SHA"

      - name: Download current test timing data
        if: steps.artifact.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-test-timing-current
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Determine identity-bound baseline artifacts
        if: steps.artifact.outputs.artifact-id != ''
        id: baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
          AKITA_REPORT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          AKITA_REPORT_HEAD_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_REPORT_HEAD_REPOSITORY: ${{ steps.pr.outputs.head-repository }}
          AKITA_REPORT_PR_NUMBER: ${{ steps.pr.outputs.issue-number }}
          AKITA_REPORT_BASE_REF: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/ci_comment_workflow.py select-timing-baselines
          --current-run-id "$AKITA_REPORT_RUN_ID"
          --workflow-name "$AKITA_REPORT_WORKFLOW_NAME"
          --artifact-name "$AKITA_TEST_TIMING_ARTIFACT_NAME"
          --head-branch "$AKITA_REPORT_HEAD_BRANCH"
          --head-repository "$AKITA_REPORT_HEAD_REPOSITORY"
          --pr-number "$AKITA_REPORT_PR_NUMBER"
          --base-ref "$AKITA_REPORT_BASE_REF"
          --max-bytes "$AKITA_REPORT_MAX_ARTIFACT_BYTES"

      - name: Download main baseline data
        if: steps.baselines.outputs.main-artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.baselines.outputs.main-artifact-id }}
          path: ${{ runner.temp }}/ci-test-timing-main-baseline
          merge-multiple: true
          run-id: ${{ steps.baselines.outputs.main-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download previous run data
        if: steps.baselines.outputs.previous-artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.baselines.outputs.previous-artifact-id }}
          path: ${{ runner.temp }}/ci-test-timing-previous-run
          merge-multiple: true
          run-id: ${{ steps.baselines.outputs.previous-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Render timing comment with trusted code
        if: steps.artifact.outputs.artifact-id != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_HEAD_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          summary_path="${{ runner.temp }}/ci-test-timing-current/summary.json"
          if [ ! -f "$summary_path" ]; then
            python3 scripts/ci_test_timing_report.py failure-summary \
              --output-dir "${{ runner.temp }}/ci-test-timing-current" \
              --source-sha "$AKITA_REPORT_HEAD_SHA" \
              --source-branch "$AKITA_REPORT_HEAD_BRANCH" \
              --workflow-run-id "$AKITA_REPORT_RUN_ID" \
              --error "CI test timing artifact missing summary.json."
          fi
          python3 scripts/ci_comment_workflow.py check-files \
            --max-bytes "$AKITA_REPORT_MAX_INPUT_BYTES" \
            "$summary_path" \
            "${{ runner.temp }}/ci-test-timing-main-baseline/summary.json" \
            "${{ runner.temp }}/ci-test-timing-previous-run/summary.json"
          python3 scripts/ci_test_timing_report.py render \
            "$summary_path" \
            --output-dir "${{ runner.temp }}/ci-test-timing-current" \
            --main-baseline-dir "${{ runner.temp }}/ci-test-timing-main-baseline" \
            --previous-baseline-dir "${{ runner.temp }}/ci-test-timing-previous-run"

      - name: Revalidate head and upsert timing PR comment
        if: steps.artifact.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AKITA_REPORT_PR_NUMBER: ${{ steps.pr.outputs.issue-number }}
          AKITA_REPORT_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          AKITA_REPORT_HEAD_BRANCH: ${{ steps.pr.outputs.head-branch }}
          AKITA_REPORT_HEAD_REPOSITORY: ${{ steps.pr.outputs.head-repository }}
          AKITA_REPORT_BASE_REPOSITORY: ${{ steps.pr.outputs.base-repository }}
          AKITA_REPORT_COMMENT: ${{ runner.temp }}/ci-test-timing-current/comment.md
        run: >-
          python3 scripts/ci_comment_workflow.py upsert-comment
          --pr-number "$AKITA_REPORT_PR_NUMBER"
          --head-sha "$AKITA_REPORT_HEAD_SHA"
          --head-branch "$AKITA_REPORT_HEAD_BRANCH"
          --head-repository "$AKITA_REPORT_HEAD_REPOSITORY"
          --base-repository "$AKITA_REPORT_BASE_REPOSITORY"
          --comment "$AKITA_REPORT_COMMENT"
          --marker "$AKITA_TEST_TIMING_MARKER"
          --max-bytes "$AKITA_REPORT_MAX_BODY_BYTES"
