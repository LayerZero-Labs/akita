# Smoke compile/test for profile/akita-recursion: the standalone sub-workspace
# that packages the Akita PCS verifier for execution inside a Jolt zkVM guest.
#
# This job does NOT run Jolt prove/trace (that needs the Jolt CLI, zeroos musl,
# and minutes of emulator time). It catches API drift between the main crates
# and the recursion glue, artifact (prover → verifier-input blob), and host
# (Jolt driver) binaries before someone runs the manual runbook in
# profile/akita-recursion/README.md.

name: Akita verifier in Jolt (profile smoke)

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - profile/akita-recursion/**
  pull_request:
    branches: ["**", main]
    paths:
      - crates/**
      - profile/akita-recursion/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jolt-verifier-profile-smoke:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile/akita-recursion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.95
          targets: riscv32imac-unknown-none-elf,riscv64imac-unknown-none-elf
          cache: false
      - name: Cache profile/akita-recursion build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: profile/akita-recursion
          # The recursion workspace depends on Akita crates outside its own
          # workspace root. Never restore their target artifacts across source
          # revisions, or Cargo can combine stale types with current schedules.
          shared-key: ci-jolt-verifier-profile-smoke-${{ github.sha }}
          cache-on-failure: true
      - name: Test AkitaJoltInputs blob encode/decode (akita-recursion-glue)
        run: cargo test --release -p akita-recursion-glue
      - name: Test trusted setup decoders (akita-recursion-glue)
        run: cargo test --release -p akita-recursion-glue --features trusted-benchmark-artifact
      - name: Compile akita-recursion-artifact and akita-recursion-host (release)
        run: cargo check --release
