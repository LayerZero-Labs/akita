# Smoke compile/test for profile/akita-recursion: the standalone sub-workspace
# that packages the Akita PCS verifier for execution inside a Jolt zkVM guest.
#
# The `check` job does NOT run Jolt prove/trace of the verifier (minutes of
# emulator time). It catches API drift between the main crates and the
# recursion glue, artifact (prover → verifier-input blob), and host (Jolt
# driver) binaries before someone runs the manual runbook in
# profile/akita-recursion/README.md.
#
# The `inline-parity` job builds a small guest with the NTT guest inline,
# traces it under Jolt's emulator, and compares its CRT+NTT results with a
# native run on the portable kernels.

name: Akita verifier in Jolt (profile smoke)

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - profile/akita-recursion/**
  pull_request:
    branches: ["**", main]
    paths:
      - crates/**
      - profile/akita-recursion/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jolt-verifier-profile-smoke:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile/akita-recursion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.95
          targets: riscv32imac-unknown-none-elf,riscv64imac-unknown-none-elf
          cache: false
      - name: Cache profile/akita-recursion build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: profile/akita-recursion
          # The recursion workspace depends on Akita crates outside its own
          # workspace root. Never restore their target artifacts across source
          # revisions, or Cargo can combine stale types with current schedules.
          shared-key: ci-jolt-verifier-profile-smoke-${{ github.sha }}
          cache-on-failure: true
      - name: Test AkitaJoltInputs blob encode/decode (akita-recursion-glue)
        run: cargo test --release -p akita-recursion-glue
      - name: Test trusted setup decoders (akita-recursion-glue)
        run: cargo test --release -p akita-recursion-glue --features trusted-benchmark-artifact
      - name: Compile akita-recursion-artifact and akita-recursion-host (release)
        run: cargo check --release

  inline-parity:
    name: inline parity (Jolt guest trace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: profile/akita-recursion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.95
          targets: riscv64imac-unknown-none-elf
          # `jolt build` compiles the std guest with `-Zbuild-std`.
          components: rust-src
          cache: false
      - name: Cache profile/akita-recursion build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: profile/akita-recursion
          # Same rule as the `check` job: Akita crates live outside this
          # workspace root, so never restore their artifacts across revisions.
          shared-key: ci-jolt-inline-parity-${{ github.sha }}
          cache-on-failure: true
      - name: Read the pinned Jolt revision
        id: jolt
        run: |
          rev=$(grep -m1 -o 'git+https://github.com/a16z/jolt?rev=[0-9a-f]*' Cargo.lock | sed 's/.*rev=//')
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      # The guest links ZeroOS, whose std build needs its musl toolchain.
      - name: Cache ZeroOS musl toolchain
        id: cache-zeroos-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.zeroos/musl
          key: zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64
      - name: Install ZeroOS musl toolchain
        if: steps.cache-zeroos-musl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/LayerZero-Labs/ZeroOS/releases/download/musl-toolchain-musl-1.2.3-gcc-9.4.0/zeroos-musl-toolchain-musl-1.2.3-gcc-9.4.0-Linux-x86_64.tar.gz -o /tmp/zeroos-musl.tar.gz
          mkdir -p ~/.zeroos
          tar -xzf /tmp/zeroos-musl.tar.gz -C ~/.zeroos
      # The SDK shells out to `jolt build`; the CLI must match the pinned SDK.
      - name: Cache jolt CLI
        id: cache-jolt-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.jolt-cli
          key: jolt-cli-${{ steps.jolt.outputs.rev }}-${{ runner.os }}
      - name: Install jolt CLI
        if: steps.cache-jolt-cli.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/a16z/jolt
          --rev ${{ steps.jolt.outputs.rev }} --locked --profile ci
          --root ~/.jolt-cli jolt
      - name: Trace the inline-parity guest
        run: |
          export JOLT_PATH="$HOME/.jolt-cli/bin/jolt"
          cargo run --release -p akita-inline-parity-host -- "$RUNNER_TEMP/akita-inline-parity-targets"
