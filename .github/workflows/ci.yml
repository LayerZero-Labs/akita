# Checks on standard GitHub-hosted runners, which cost nothing on a public
# repository. They run on every pull request push, in the merge queue, and on
# main. The workspace test pass on the large runner lives in full-tests.yml.
#
# Caches: a pull request restores caches saved on main and never saves its
# own. Each job's cache is about 600 MB and the repository cap is 10 GB, so
# pull request saves evicted main's entries and no job ever hit a cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]
  merge_group:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  taplo:
    name: TOML format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install taplo
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # taplo-cli
        with:
          tool: taplo-cli
      - name: Check TOML formatting
        run: taplo fmt --check

  rust-file-lines:
    name: Rust file line cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Rust file line checker
        run: scripts/test-rust-file-lines.sh
      - name: Enforce Rust file line cap (zero exceptions)
        run: scripts/check-rust-file-lines.sh --no-baseline
      - name: Enforce proof-input guardrails
        run: scripts/check-proof-stream-guardrails.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          components: clippy
      - name: Clippy (transparent default features)
        run: cargo clippy --all --all-targets --release --no-default-features --features parallel,disk-persistence,transcript-keccak -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all --all-targets --release --no-default-features --features transcript-keccak -- -D warnings
      - name: Clippy (response model diagnostics)
        run: cargo clippy -p akita-pcs --all-targets --release --no-default-features --features parallel,response-model-diagnostics,transcript-keccak -- -D warnings
      - name: Clippy (dev protocol)
        run: cargo clippy --all --all-targets --release --no-default-features --features parallel,disk-persistence,transcript-keccak,dev-protocol -- -D warnings
      - name: Crate dependency hygiene
        run: |
          scripts/check-crate-deps.sh akita-verifier
          scripts/check-crate-deps.sh akita-prover
          scripts/check-crate-deps.sh akita-cpu-backend
          scripts/check-crate-deps.sh akita-config
          scripts/check-crate-deps.sh akita-planner
          scripts/check-crate-deps.sh akita-setup
          scripts/check-crate-deps.sh akita-params
          scripts/check-crate-deps.sh akita-schedules
          scripts/check-crate-deps.sh akita-sis-estimator
          scripts/check-crate-deps.sh akita-metal
          scripts/check-crate-deps.sh akita-zk-verifier
          scripts/check-crate-deps.sh akita-zk-prover

  binary-trinomial:
    name: Binary trinomial arithmetic and relation bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Test trinomial arithmetic
        run: cargo test -p akita-algebra --lib --no-default-features --features binary
      - name: Clippy trinomial arithmetic and benchmarks
        run: cargo clippy -p akita-algebra --lib --benches --no-default-features --features binary -- -D warnings
      - name: Test trinomial relation geometry
        run: cargo test -p akita-types --lib --no-default-features --features binary,transcript-keccak
      - name: Test trinomial quotient kernel
        run: cargo test -p akita-cpu-backend --lib --no-default-features --features binary,transcript-keccak -- kernels::trinomial_relation
      - name: Test compact imports and ordinary preimages
        run: cargo test -p akita-cpu-backend --lib --no-default-features --features binary,transcript-keccak opaque::binary
      - name: Clippy trinomial bridge and ordinary preimages
        run: cargo clippy -p akita-types -p akita-cpu-backend -p akita-params -p akita-planner --all-targets --no-default-features --features binary,transcript-keccak -- -D warnings
      - name: Test owned binary source kernels
        run: |
          for backend in transcript-blake2b transcript-keccak; do
            cargo test -p akita-cpu-backend --test binary --no-default-features --features "binary,$backend"
            cargo test -p akita-cpu-backend --test binary --no-default-features --features "parallel,binary,$backend"
          done
      - name: Test binary source end-to-end opening
        run: cargo test --release -p akita-pcs --test binary_end_to_end --no-default-features --features parallel,binary,transcript-keccak


  binary-field:
    name: Binary field arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Test algebra without the extension
        run: cargo test -p akita-algebra --lib --no-default-features
      - name: Test binary arithmetic
        run: cargo test -p akita-algebra --lib --no-default-features --features binary binary
      - name: Test parallel binary arithmetic
        run: cargo test -p akita-algebra --lib --no-default-features --features binary,parallel binary
      - name: Lint parallel binary arithmetic and benchmarks
        run: cargo clippy -p akita-algebra --all-targets --no-default-features --features binary,parallel -- -D warnings
      - name: Lint binary arithmetic and benchmarks
        run: cargo clippy -p akita-algebra --all-targets --no-default-features --features binary -- -D warnings

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Install cargo-machete
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # cargo-machete
        with:
          tool: cargo-machete
      - name: Check unused dependencies
        run: cargo machete --with-metadata

  shared-field:
    name: Shared field identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Require one jolt-field identity and no akita-field
        run: scripts/check-shared-field-identity.sh

  jolt-pins:
    name: Jolt pins on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every a16z/jolt rev to be an ancestor of Jolt main
        run: scripts/check-jolt-pins-on-main.sh

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build documentation
        run: cargo doc -q --release --no-deps --no-default-features --features parallel,disk-persistence,transcript-keccak
        env:
          RUSTDOCFLAGS: -D warnings

  test-schedule-artifact-drift:
    name: Schedule artifact drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          components: rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-schedule-artifact-drift
          add-job-id-key: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every other job consumes tracked artifacts. This is the sole CI
      # regeneration owner and the merge gate for planner/artifact drift.
      - name: Trusted artifact guards
        run: |
          scripts/check-external-schedule-artifacts.sh
          cargo test --release -p akita-config --test trusted_schedule_artifact
      - name: Regenerate schedule artifacts in temporary storage
        # Planning measured about 18 minutes on CI with two workers, and runner
        # variance alone has moved this step by about 1.3x. The bound stops a
        # runaway search. Growth in search size (states, candidates,
        # descriptors) fails the --planner-cost-baseline check instead; slower
        # per-candidate pricing is caught only by this timeout.
        timeout-minutes: 35
        env:
          AKITA_SCHEDULE_GEN_JOBS: 2
        run: |
          artifact_dir="$RUNNER_TEMP/akita-schedule-artifacts"
          mkdir -p "$artifact_dir"
          cargo run --release -p akita-planner --features catalog-gen \
            --bin gen_schedule_artifacts -- "$artifact_dir" --row-progress \
            --catalog-baseline artifacts/schedule-catalog.tsv \
            --require-catalog-baseline-match \
            --catalog-report "$RUNNER_TEMP/akita-schedule-baseline-comparison.tsv" \
            --planner-cost-baseline artifacts/schedule-planner-cost.tsv
          diff -ru artifacts/schedules "$artifact_dir"
      - name: Direct modeled SIS cost for every schedule
        run: |
          cargo run --release -p akita-planner \
            --features catalog-security \
            --example catalog_security -- --check
      - name: Dense multi-chunk PCS e2e
        run: |
          cargo test --release -p akita-pcs --test akita_fp128_e2e --no-default-features --features parallel,transcript-keccak -- --exact fp128_dense_mc
      - name: One-hot multi-chunk catalog wiring
        run: |
          cargo test --release -p akita-pcs --test akita_fp128_e2e --no-default-features --features parallel,transcript-keccak -- --exact fp128_onehot_mc_catalog_resolves
      - name: Bounded dense source PCS e2e
        run: |
          cargo test --release -p akita-pcs --test akita_fp128_e2e --no-default-features --features parallel,transcript-keccak -- heterogeneous::bounded_
          cargo test --release -p akita-config --test bounded_dense_source
      - name: Combined-family setup at exact capacities
        run: |
          cargo test --release -p akita-pcs --test akita_fp128_e2e --no-default-features --features parallel,transcript-keccak -- --exact heterogeneous::combined_family_setup_matches_per_family_proofs

  # The dev protocol has its own schedule set, so its drift check runs apart
  # from the default one. Its tests run in `test-dev-protocol`.
  test-dev-protocol-drift:
    name: Dev protocol schedule artifact drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-dev-protocol-drift
          add-job-id-key: false
          cache-on-failure: true
      - name: Trusted dev artifact guard
        run: |
          cargo test --release -p akita-config --features dev-protocol --test trusted_schedule_artifact
      - name: Regenerate dev schedule artifacts in temporary storage
        env:
          AKITA_SCHEDULE_GEN_JOBS: 2
        run: |
          artifact_dir="$RUNNER_TEMP/akita-schedule-artifacts-dev"
          mkdir -p "$artifact_dir"
          cargo run --release -p akita-planner --features catalog-gen,dev-protocol \
            --bin gen_schedule_artifacts -- "$artifact_dir" --row-progress \
            --catalog-baseline artifacts/schedule-catalog-dev.tsv \
            --require-catalog-baseline-match \
            --catalog-report "$RUNNER_TEMP/akita-schedule-dev-baseline-comparison.tsv"
          diff -ru artifacts/schedules-dev "$artifact_dir"
      - name: Direct modeled SIS cost for every dev schedule
        run: |
          cargo run --release -p akita-planner \
            --features catalog-security,dev-protocol \
            --example catalog_security -- --check

  # The workspace test suite under the dev protocol, sharded like `test`. It
  # uploads no timing artifacts; `test-timing` reports the default build.
  test-dev-protocol:
    name: Test dev protocol (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: GitHubRunner-Large-Public
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-dev-protocol
          add-job-id-key: false
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # carg-nextest
        with:
          tool: cargo-nextest
      - name: Run tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          cargo nextest run --lib --bins --tests --profile ci --cargo-profile ci-test --no-default-features --features parallel,disk-persistence,catalog-gen,transcript-keccak,dev-protocol \
            --partition "slice:${SHARD_INDEX}/${SHARD_TOTAL}"

  test-transcript-backends:
    name: Transcript semantics (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # Cold release builds span several logging-transcript test binaries and
    # can exceed 40 minutes before the final protocol suites finish compiling.
    timeout-minutes: 60
    strategy:
      matrix:
        backend: [transcript-blake2b, transcript-keccak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run semantic transcript suites
        run: >-
          cargo test --release -p akita-pcs
          --test transcript_hardening
          --test transcript_hardening_proptest
          --test embedded_transcript
          --no-default-features
          --features parallel,logging-transcript,${{ matrix.backend }}
          --
          --test-threads=1
      - name: Run Spongefish stream and mutation suites
        run: |
          cargo test --release -p akita-transcript \
            --no-default-features \
            --features prover,logging-transcript,${{ matrix.backend }} \
            proof_stream --lib
          cargo test --release -p akita-pcs \
            --no-default-features \
            --features parallel,logging-transcript,${{ matrix.backend }} \
            spongefish_roundtrip_and_statement_binding --lib
          cargo test --release -p akita-pcs \
            --no-default-features \
            --features parallel,logging-transcript,${{ matrix.backend }} \
            selective_l2_proof_rejects_transcript_mutations --lib
      - name: Run protocol suites with proof channel tracing
        run: >-
          cargo test --release -p akita-pcs
          --test protocol_soundness
          --test fold_linf
          --no-default-features
          --features parallel,logging-transcript,${{ matrix.backend }}
          --
          --test-threads=1
      - name: Audit the grinding plan across akita-types shapes
        run: >-
          cargo test --release -p akita-types
          --no-default-features
          --features prover,logging-transcript,${{ matrix.backend }}
      - name: Keccak-256 digest known answers
        run: >-
          cargo test --release
          -p akita-transcript -p akita-params -p akita-types
          --no-default-features
          --features akita-transcript/keccak256-digests,akita-transcript/prover,akita-transcript/${{ matrix.backend }},akita-params/${{ matrix.backend }},akita-types/${{ matrix.backend }}
          --lib

  # Exercise the proof stream through the opaque CPU backend under both
  # transcript hashes, including a small-field Stage 1 route.
  test-inline-backends:
    name: Guest inline backends
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: riscv64gc-unknown-linux-gnu
      # The guest backends select themselves only on riscv64. The NTT inline's
      # portable fallback runs on any host, so its table layout is pinned here;
      # the `inline-parity` job in jolt-verifier-profile-smoke.yml executes the
      # inlines in a traced Jolt guest.
      - name: Inline NTT against the portable transform
        run: cargo test --release -p akita-algebra --features ntt-inline --lib
      - name: Host builds with every inline feature
        run: cargo check --release -p akita-pcs --features ntt-inline
      # A riscv64 target compiles every guest-selected path; the inline
      # instructions run only under Jolt's emulator, so this is a build check.
      - name: RISC-V builds with every inline feature
        run: >-
          cargo check --release -p akita-pcs --target riscv64gc-unknown-linux-gnu
          --features ntt-inline

  test-proof-stream-roundtrips:
    name: Proof channel roundtrips (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        backend: [transcript-blake2b, transcript-keccak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Audit proof roundtrips
        run: >-
          cargo test --release -p akita-pcs --test proof_stream_smoke
          --no-default-features
          --features parallel,${{ matrix.backend }}
          --
          --test-threads=1

  test-binary-setup:
    name: Binary setup and q24 certificate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Test binary setup and the q24 certificate
        run: |
          cargo test -p akita-params --lib --no-default-features --features binary,transcript-keccak binary_setup
          cargo test -p akita-sis-estimator --lib --test q24_width_table --no-default-features --features binary
      - name: Check opt-in estimator targets
        run: cargo clippy -p akita-params -p akita-sis-estimator --all-targets --no-default-features --features binary,transcript-keccak -- -D warnings

  test-binary-challenges:
    name: Binary challenge families (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        backend: [transcript-blake2b, transcript-keccak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Test opt-in binary families
        run: cargo test -p akita-challenges --lib --no-default-features --features binary,${{ matrix.backend }}
      - name: Check opt-in challenge targets
        run: cargo clippy -p akita-challenges --all-targets --no-default-features --features binary,${{ matrix.backend }} -- -D warnings

  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          files: .

  # The required status check for pull requests and the merge queue. A
  # cancelled job fails the gate: GitHub counts a skipped required check as
  # passing, so the gate itself must never be skipped.
  gate:
    name: CI gate
    if: always()
    needs:
      - fmt
      - taplo
      - rust-file-lines
      - clippy
      - machete
      - shared-field
      - doc
      - test-schedule-artifact-drift
      - test-transcript-backends
      - test-inline-backends
      - test-proof-stream-roundtrips
      - script-tests
      - typos
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
