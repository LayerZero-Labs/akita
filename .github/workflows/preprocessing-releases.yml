name: Preprocessing releases

# Required merge check: every anchored release under params/ regenerates from
# scratch to the checked-in manifest, byte for byte. A scheduled run
# regenerates every release independently of any change.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate anchored releases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Decide whether the generator's inputs changed
        id: decide
        run: scripts/check-release-regeneration-needed.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}"
      - name: Regenerate every release and compare manifests
        if: steps.decide.outputs.needed == 'true'
        run: cargo run --release -p akita-preprocess -- check
