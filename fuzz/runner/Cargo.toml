[package]
name = "akita-fuzz-runner"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone campaign runner. It does not link Akita: the instrumented targets
# it drives are built by `cargo fuzz build` (see `akita-fuzz prepare`).
[[bin]]
name = "akita-fuzz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
