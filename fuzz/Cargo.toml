[package]
name = "akita-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "679f838496ae4539566e7591e837ea1b0edcd91c", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { path = "../crates/akita-serialization" }
akita-error = { path = "../crates/akita-error" }
akita-sumcheck = { path = "../crates/akita-sumcheck" }
akita-transcript = { path = "../crates/akita-transcript" }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "serialization_vec"
path = "fuzz_targets/serialization_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_labels"
path = "fuzz_targets/transcript_labels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sumcheck_rounds"
path = "fuzz_targets/sumcheck_rounds.rs"
test = false
doc = false
bench = false
