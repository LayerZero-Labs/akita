[package]
name = "akita-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9d2eb0f211ae7c35f2c765002e7ece72c1dae424", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { path = "../crates/akita-serialization" }
akita-error = { path = "../crates/akita-error" }
akita-sumcheck = { path = "../crates/akita-sumcheck" }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9d2eb0f211ae7c35f2c765002e7ece72c1dae424", default-features = false, features = [
  "transcript-blake2b",
] }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "serialization_vec"
path = "fuzz_targets/serialization_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sumcheck_rounds"
path = "fuzz_targets/sumcheck_rounds.rs"
test = false
doc = false
bench = false
