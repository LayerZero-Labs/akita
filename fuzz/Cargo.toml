[package]
name = "akita-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = [".", "runner"]

[lib]
path = "src/lib.rs"

[features]
default = ["parallel"]
# Rayon-parallel production paths. Build with `--no-default-features` for the
# sequential feature graph, which CI otherwise never executes.
parallel = [
  "akita-cpu-backend/parallel",
  "akita-pcs/parallel",
  "akita-prover/parallel",
  "akita-sumcheck/parallel",
  "akita-types/parallel",
  "akita-verifier/parallel",
  "jolt-field/parallel",
]

[dependencies]
akita-algebra = { path = "../crates/akita-algebra" }
akita-config = { path = "../crates/akita-config", default-features = false, features = ["transcript-blake2b"] }
akita-cpu-backend = { path = "../crates/akita-cpu-backend", default-features = false, features = ["transcript-blake2b"] }
akita-error = { path = "../crates/akita-error" }
akita-pcs = { path = "../crates/akita-pcs", default-features = false, features = ["transcript-blake2b"] }
akita-prover = { path = "../crates/akita-prover", default-features = false, features = ["transcript-blake2b"] }
akita-schedules = { path = "../crates/akita-schedules", default-features = false, features = ["transcript-blake2b"] }
akita-serialization = { path = "../crates/akita-serialization" }
akita-sumcheck = { path = "../crates/akita-sumcheck", default-features = false, features = ["transcript-blake2b"] }
akita-transcript = { path = "../crates/akita-transcript", default-features = false, features = ["transcript-blake2b"] }
akita-types = { path = "../crates/akita-types", default-features = false, features = ["transcript-blake2b"] }
akita-verifier = { path = "../crates/akita-verifier", default-features = false, features = ["transcript-blake2b"] }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e290a0d10a30f16dafd4b1ef65f3ebbb497b8f6c", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e290a0d10a30f16dafd4b1ef65f3ebbb497b8f6c", default-features = false }
libfuzzer-sys = "0.4.12"
num-bigint = "0.4"
rayon = "1.10"

# cargo-fuzz builds with `--release`; keep assertions, overflow checks, and
# line tables so findings carry actionable diagnostics.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

