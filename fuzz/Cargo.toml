[package]
name = "akita-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "ba33d69acfbb838cd1fbc99a2c4c62f1ada734d9", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "ba33d69acfbb838cd1fbc99a2c4c62f1ada734d9", default-features = false }
akita-serialization = { path = "../crates/akita-serialization" }
akita-sumcheck = { path = "../crates/akita-sumcheck" }
akita-transcript = { path = "../crates/akita-transcript" }
akita-types = { path = "../crates/akita-types" }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "serialization_vec"
path = "fuzz_targets/serialization_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_labels"
path = "fuzz_targets/transcript_labels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sumcheck_rounds"
path = "fuzz_targets/sumcheck_rounds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_shapes"
path = "fuzz_targets/proof_shapes.rs"
test = false
doc = false
bench = false
