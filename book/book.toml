[book]
authors = [
  "Freya Liu <freya@cmu.edu>",
  "Quang Dao <qvd@andrew.cmu.edu>",
  "Omid Bodaghi <omid.bodaghi@layerzerolabs.org>",
  "Amirhossein Khajehpour <amir.kh@layerzerolabs.org>",
  "Taghi Badakhshan <taghi.badakhshan@layerzerolabs.org>",
  "Giuseppe Vitto <giuseppe.vitto@layerzerolabs.org>",
]
language = "en"
src = "src"
title = "Akita Book"
description = "Documentation for Akita, a lattice-based polynomial commitment scheme."

[preprocessor.katex]
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/LayerZero-Labs/akita"
edit-url-template = "https://github.com/LayerZero-Labs/akita/edit/main/book/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
