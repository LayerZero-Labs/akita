[package]
name = "akita-sampler-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
common = { git = "https://github.com/a16z/jolt", rev = "83fcab4937c492615b068dc852ad848c3b20cde0" }
jolt-program = { git = "https://github.com/a16z/jolt", rev = "83fcab4937c492615b068dc852ad848c3b20cde0", features = [
  "image",
] }
tracer = { git = "https://github.com/a16z/jolt", rev = "83fcab4937c492615b068dc852ad848c3b20cde0", default-features = false, features = [
  "std",
] }
akita-challenges = { path = "../../../../crates/akita-challenges", default-features = false, features = [
  "transcript-blake2b",
] }
guest = { package = "akita-sampler-guest", path = "../guest" }
jolt-host = { git = "https://github.com/a16z/jolt", rev = "83fcab4937c492615b068dc852ad848c3b20cde0" }
jolt-inlines-keccak256 = { git = "https://github.com/a16z/jolt", rev = "83fcab4937c492615b068dc852ad848c3b20cde0", features = [
  "host",
] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
