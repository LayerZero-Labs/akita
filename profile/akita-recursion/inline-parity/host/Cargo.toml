[package]
name = "akita-inline-parity-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Trace the Akita inline-parity guest under Jolt and compare it with a portable native run."
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata.cargo-machete]
ignored = ["jolt-inlines-ntt", "jolt-sdk-macros"]

[[bin]]
name = "akita-inline-parity-host"
path = "src/main.rs"

[dependencies]
guest = { package = "akita-inline-parity-guest", path = "../guest" }
jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false, features = [
  "host",
] }
# Pinned with `guest-std` so `#[jolt::provable]` builds the guest in std mode
# without pulling ZeroOS musl into the host build (see `../../host/Cargo.toml`).
jolt-sdk-macros = { git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", features = [
  "guest-std",
] }
# Linked for their `inventory` registrations: Jolt expands an inline
# instruction only when its crate's `host` feature is in the host binary.
jolt-inlines-ntt = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", features = [
  "host",
] }
jolt-program = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", features = [
  "image",
] }
akita-algebra = { path = "../../../../crates/akita-algebra" }
