[package]
name = "akita-recursion-glue"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Shared blob format for shipping Akita verifier inputs to a Jolt guest program."
repository = "https://github.com/LayerZero-Labs/hachi"
readme = "../../../README.md"
publish = false

[features]
trusted-benchmark-artifact = []

[dependencies]
akita-error = { version = "0.1.0", path = "../../../crates/akita-error" }
akita-algebra = { version = "0.1.0", path = "../../../crates/akita-algebra" }
akita-config = { version = "0.1.0", path = "../../../crates/akita-config", default-features = false }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "c93d6f0899661b9f1ff907bf3dea30386aaf59b6", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../../../crates/akita-serialization" }
akita-schedules = { version = "0.1.0", path = "../../../crates/akita-schedules" }
akita-types = { version = "0.1.0", path = "../../../crates/akita-types", default-features = false }
akita-params = { version = "0.1.0", path = "../../../crates/akita-params", default-features = false }

[dev-dependencies]
akita-challenges = { version = "0.1.0", path = "../../../crates/akita-challenges", default-features = false }
akita-config = { version = "0.1.0", path = "../../../crates/akita-config", default-features = false, features = [
  "test-support",
] }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
