[package]
name = "akita-serialization"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = [
  "Markos Georghiades <mgeorghiades@a16z.com>",
  "Quang Dao <qvd@andrew.cmu.edu>",
  "Amirhossein Khajehpour <amir.kh@layerzerolabs.org>",
  "Omid Bodaghi <omibo@layerzero.foundation>",
  "Giuseppe Vitto <giuseppe.vitto@layerzerolabs.org>",
]
license = "Apache-2.0 OR MIT"
description = "Serialization traits for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9af4548682d37aeb88c6eb62ec36f07f06140bdb", default-features = false, features = [
  "solinas",
] }
thiserror = "2.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
