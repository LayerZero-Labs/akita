[package]
name = "akita-serialization"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Serialization traits for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "a956128715473586423edb2085cc5dd889c9193d", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "a956128715473586423edb2085cc5dd889c9193d", default-features = false }
thiserror = "2.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
