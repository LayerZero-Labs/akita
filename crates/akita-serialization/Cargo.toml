[package]
name = "akita-serialization"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Serialization traits for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "495ba15585790a1a3d1932865fe2f59e7cde1b27", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "495ba15585790a1a3d1932865fe2f59e7cde1b27", default-features = false }
thiserror = "2.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
