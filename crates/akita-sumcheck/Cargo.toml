[package]
name = "akita-sumcheck"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Generic sumcheck machinery for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "25d87ba68bde9f4a85ac986f5487b2e7b7db2699", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "25d87ba68bde9f4a85ac986f5487b2e7b7db2699", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }

[features]
default = ["transcript-keccak"]
transcript-blake2b = ["akita-transcript/transcript-blake2b"]
transcript-keccak = ["akita-transcript/transcript-keccak"]
parallel = [
  "jolt-poly/parallel",
  "akita-algebra/parallel",
  "jolt-field/parallel",
]

[lints]
workspace = true
