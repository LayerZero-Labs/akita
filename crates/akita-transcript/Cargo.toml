[package]
name = "akita-transcript"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Fiat-Shamir transcripts for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "679f838496ae4539566e7591e837ea1b0edcd91c", default-features = false, features = [
  "asm",
  "solinas",
] }
spongefish = { git = "https://github.com/arkworks-rs/spongefish", rev = "ef9741346a150039427d9e0c02d6b2d73e93ec81", default-features = false, optional = true, features = [
  "yolocrypto",
] }

[features]
default = ["transcript-blake2b"]
logging-transcript = []
# spongefish 0.7 imports StdHash from its prover/verifier/domain modules
# even when Akita selects Blake2b or Keccak explicitly, so sha3 is required
# for the crate to compile with default-features disabled.
transcript-blake2b = ["dep:spongefish", "spongefish/blake2", "spongefish/sha3"]
transcript-keccak = ["dep:spongefish", "spongefish/keccak", "spongefish/sha3"]

[lints]
workspace = true
