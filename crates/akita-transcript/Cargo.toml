[package]
name = "akita-transcript"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Fiat-Shamir transcripts for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "86e5ed7ce0f1c8c8650c2a2837f47513358782f1", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "86e5ed7ce0f1c8c8650c2a2837f47513358782f1", default-features = false, features = [
  "solinas",
] }
spongefish = { version = "=0.8.0", default-features = false }

[features]
default = ["transcript-keccak"]
logging-transcript = []
transcript-blake2b = ["jolt-transcript/transcript-blake2b"]
transcript-keccak = ["jolt-transcript/transcript-keccak"]
# The prover's proof-of-work and fold-response searches copy the public sponge
# state, which spongefish 0.8.0 exposes only under `yolocrypto`. Verifier
# builds leave this feature off.
prover = ["jolt-transcript/prover-grinding", "spongefish/yolocrypto"]
# Searches proof-of-work nonces on all threads; the nonce found is the same.
parallel = ["prover", "jolt-transcript/parallel"]

[lints]
workspace = true
