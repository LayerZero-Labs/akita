[package]
name = "akita-labinius-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Opt-in LaBinius root reduction prover for Akita"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-cpu-backend = { version = "0.1.0", path = "../akita-cpu-backend", default-features = false, optional = true }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
rayon = { version = "1.10", optional = true }
tracing = "0.1"
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-labinius-verifier = { version = "0.1.0", path = "../akita-labinius-verifier", default-features = false, features = [
  "prover",
] }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false, features = [
  "asm",
  "solinas",
] }

jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false }

akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }

[dev-dependencies]
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "response_weights"
harness = false
required-features = ["labinius"]

[[bench]]
name = "combined_kernel"
harness = false
required-features = ["labinius"]

[features]
default = ["transcript-keccak"]
parallel = [
  "akita-cpu-backend?/parallel",
  "dep:rayon",
  "akita-algebra/parallel",
  "akita-labinius-verifier/parallel",
  "jolt-field/parallel",
]
labinius = [
  "dep:akita-cpu-backend",
  "akita-cpu-backend/labinius-trinomial",
  "akita-algebra/labinius-binary",
  "akita-algebra/labinius-trinomial",
  "akita-challenges/labinius-challenges",
  "akita-params/labinius-sis",
  "akita-labinius-verifier/labinius",
]
transcript-blake2b = [
  "akita-cpu-backend?/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-challenges/transcript-blake2b",
  "akita-params/transcript-blake2b",
  "akita-labinius-verifier/transcript-blake2b",
]
transcript-keccak = [
  "akita-cpu-backend?/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-challenges/transcript-keccak",
  "akita-params/transcript-keccak",
  "akita-labinius-verifier/transcript-keccak",
]

[lints]
workspace = true
