[package]
name = "akita-pcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = [
  "Markos Georghiades <mgeorghiades@a16z.com>",
  "Quang Dao <qvd@andrew.cmu.edu>",
  "Amirhossein Khajehpour <amir.kh@layerzerolabs.org>",
  "Omid Bodaghi <omibo@layerzero.foundation>",
  "Giuseppe Vitto <giuseppe.vitto@layerzerolabs.org>",
]
license = "Apache-2.0 OR MIT"
description = "A high performance and modular implementation of the Akita polynomial commitment scheme."
repository = "https://github.com/LayerZero-Labs/akita"
documentation = "https://docs.rs/akita-pcs"
readme = "../../README.md"
keywords = [
  "cryptography",
  "zkp",
  "commitment",
  "polynomial",
  "pcs",
  "lattice",
  "post-quantum",
]
categories = ["cryptography", "algorithms"]
include = ["src/**", "examples/**", "benches/**", "Cargo.toml"]

[package.metadata.docs.rs]
no-default-features = true
features = ["parallel", "schedules-default", "transcript-blake2b"]

[package.metadata.cargo-machete]
ignored = ["akita-setup"]

[features]
default = ["parallel", "schedules-default", "transcript-blake2b"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-config/transcript-blake2b",
  "akita-prover/transcript-blake2b",
  "akita-planner/transcript-blake2b",
  "akita-setup/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-types/transcript-blake2b",
  "akita-verifier/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-config/transcript-keccak",
  "akita-prover/transcript-keccak",
  "akita-planner/transcript-keccak",
  "akita-setup/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-types/transcript-keccak",
  "akita-verifier/transcript-keccak",
]
parallel = [
  "dep:rayon",
  "akita-algebra/parallel",
  "jolt-field/parallel",
  "akita-prover/parallel",
  "akita-setup/parallel",
  "akita-sumcheck/parallel",
  "akita-verifier/parallel",
]
schedules-default = ["akita-config/schedules-default"]
profile-ci = [
  "profile-ci-fp32",
  "profile-ci-fp64",
  "profile-ci-fp128-base",
  "profile-ci-multi-group-direct",
  "profile-ci-multi-group-recursive",
  "profile-ci-multi-group-recursive-w8r2",
  "profile-ci-distributed",
]
# Each CI matrix group enables one narrow profile feature so rustc only builds
# the concrete profile modes that the group runs. `profile-ci` remains the
# compatibility union for local use and older merge-base checkouts. It is the
# transitive union of the narrow features above, so those lists cannot drift.
profile-bench-selected = []
profile-ci-fp32 = [
  "profile-bench-selected",
  "akita-config/schedules-fp32-dense",
  "akita-config/schedules-fp32-onehot",
]
profile-ci-fp64 = [
  "profile-bench-selected",
  "akita-config/schedules-fp64-dense",
  "akita-config/schedules-fp64-onehot",
]
profile-ci-fp128-base = [
  "profile-bench-selected",
  "akita-config/schedules-fp128-dense",
  "akita-config/schedules-fp128-onehot",
  "akita-config/schedules-fp128-onehot-recursive",
]
profile-ci-multi-group-direct = [
  "profile-bench-selected",
  "akita-config/schedules-fp128-onehot",
]
profile-ci-multi-group-recursive = [
  "profile-bench-selected",
  "akita-config/schedules-fp128-onehot-recursive",
]
profile-ci-multi-group-recursive-w8r2 = [
  "profile-bench-selected",
  "akita-config/schedules-fp128-onehot-recursive-multi-chunk-w8r2",
]
profile-ci-distributed = [
  "profile-bench-selected",
  "akita-config/schedules-fp128-onehot-multi-chunk",
  "akita-config/schedules-fp128-onehot-multi-chunk-w2r2",
  "akita-config/schedules-fp128-onehot-multi-chunk-w4r2",
]
# Compile the profile example with only the singleton adaptive fp128 one-hot
# configuration. Run with `--no-default-features` so unrelated schedule tables
# and profile-mode monomorphizations stay out of the binary.
profile-onehot-fp128 = ["akita-config/schedules-fp128-onehot"]
schedules-fp128-dense-multi-chunk = [
  "akita-config/schedules-fp128-dense-multi-chunk",
]
schedules-fp128-dense-bounded = ["akita-config/schedules-fp128-dense-bounded"]
schedules-fp128-onehot-multi-chunk = [
  "akita-config/schedules-fp128-onehot-multi-chunk",
]
schedules-fp128-onehot-recursive = [
  "akita-config/schedules-fp128-onehot-recursive",
]
schedules-fp128-onehot-recursive-multi-chunk = [
  "akita-config/schedules-fp128-onehot-recursive-multi-chunk-w8r2",
]
disk-persistence = ["akita-setup/disk-persistence"]
logging-transcript = [
  "akita-transcript/logging-transcript",
  "akita-prover/logging-transcript",
]
response-model-diagnostics = ["akita-prover/response-model-diagnostics"]
[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "72dc6451628d8b1dd794147a1f1cc40be0d77963", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
akita-verifier = { version = "0.1.0", path = "../akita-verifier", default-features = false }
akita-prover = { version = "0.1.0", path = "../akita-prover", default-features = false }
akita-setup = { version = "0.1.0", path = "../akita-setup", default-features = false }
tracing = "0.1"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
# Test-only: pull in `akita-config`'s test-support layout helpers
# (e.g. `test_support::akita_batched_root_layout`). Do not enable
# schedule-table features here: Cargo feature unification would link those
# tables into the profile-ci binary
# (`--no-default-features --features profile-ci`), failing
# `scripts/check_profile_ci_linkage.sh`. Tests that need extra tables rely
# on `default = ["schedules-default"]` or explicit `required-features`.
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
] }
akita-planner = { version = "0.1.0", path = "../akita-planner", default-features = false, features = [
  "test-support",
] }
akita-schedules = { version = "0.1.0", path = "../akita-schedules", default-features = false }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
criterion = { version = "0.5", features = ["html_reports"] }
num-bigint = "0.4.6"
proptest = "1.6"
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra", rev = "3b2a12492cfeb34774a2cdbe9d8d7a869c883fa9", features = [
  "scalar_field",
] }
ark-ff = { git = "https://github.com/arkworks-rs/algebra", rev = "3b2a12492cfeb34774a2cdbe9d8d7a869c883fa9" }
p3-field = "=0.5.3"
p3-mersenne-31 = "=0.5.3"
p3-baby-bear = "=0.5.3"
p3-koala-bear = "=0.5.3"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
libc = "0.2"

[[example]]
name = "profile"
path = "examples/profile/main.rs"

[[bench]]
name = "ring_ntt"
harness = false

[[bench]]
name = "ntt_matvec"
harness = false

[[bench]]
name = "field_arith"
harness = false

[[bench]]
name = "akita_e2e"
harness = false

[[bench]]
name = "root_kernels"
harness = false

[[bench]]
name = "coefficient_packing"
harness = false

[[bench]]
name = "decompose_fold"
harness = false

[[bench]]
name = "digit_range"
harness = false

[[bench]]
name = "fft_smooth"
harness = false

[[bench]]
name = "setup_index_weight"
harness = false

[lints]
workspace = true
