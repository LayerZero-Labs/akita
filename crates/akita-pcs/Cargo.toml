[package]
name = "akita-pcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "A high performance and modular implementation of the Akita polynomial commitment scheme."
repository = "https://github.com/LayerZero-Labs/akita"
documentation = "https://docs.rs/akita-pcs"
readme = "../../README.md"
keywords = [
  "cryptography",
  "zkp",
  "commitment",
  "polynomial",
  "pcs",
  "lattice",
  "post-quantum",
]
categories = ["cryptography", "algorithms"]
include = ["src/**", "examples/**", "benches/**", "Cargo.toml"]

[package.metadata.docs.rs]
no-default-features = true
features = ["parallel", "transcript-keccak"]

[package.metadata.cargo-machete]
ignored = ["akita-setup"]

[features]
# Extension seam: opt-in native binary-source protocol and measurement tooling.
# <https://github.com/LayerZero-Labs/akita/issues/285>.
binary-source-measurements = ["labinius-trinomial"]
labinius-trinomial = [
  "akita-algebra/labinius-trinomial",
  "akita-algebra/labinius-binary",
  "akita-challenges/labinius-challenges",
  "akita-cpu-backend/labinius-trinomial",
  "akita-planner/labinius-trinomial",
  "akita-prover/labinius-trinomial",
  "akita-types/labinius-trinomial",
  "akita-verifier/labinius-trinomial",
]
default = ["parallel", "transcript-keccak"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-config/transcript-blake2b",
  "akita-cpu-backend/transcript-blake2b",
  "akita-prover/transcript-blake2b",
  "akita-planner/transcript-blake2b",
  "akita-setup/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-types/transcript-blake2b",
  "akita-params/transcript-blake2b",
  "akita-verifier/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-config/transcript-keccak",
  "akita-cpu-backend/transcript-keccak",
  "akita-prover/transcript-keccak",
  "akita-planner/transcript-keccak",
  "akita-setup/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-types/transcript-keccak",
  "akita-params/transcript-keccak",
  "akita-verifier/transcript-keccak",
]
# Optional (default off): sums of products at the structured
# sites of the verifier's setup scan (same field values).
setup-sop-structured = ["akita-verifier/setup-sop-structured"]
# Keccak-256 instead of SHA3-256 digests; see `akita-transcript`.
keccak256-digests = ["akita-transcript/keccak256-digests"]
# 64-point NTT and pointwise-dot inlines for a RISC-V guest verifier.
ntt-inline = ["akita-algebra/ntt-inline"]
parallel = [
  "dep:rayon",
  "akita-algebra/parallel",
  "jolt-algebra/parallel",
  "akita-prover/parallel",
  "akita-cpu-backend/parallel",
  "akita-setup/parallel",
  "akita-verifier/parallel",
]
profile-ci = [
  "profile-ci-fp32",
  "profile-ci-fp64",
  "profile-ci-fp128-base",
  "profile-ci-multi-group-direct",
  "profile-ci-multi-group-recursive",
  "profile-ci-multi-group-recursive-w8r2",
  "profile-ci-distributed",
]
# Each CI matrix group enables one narrow profile feature so rustc only builds
# the concrete profile modes that the group runs. `profile-ci` remains the
# compatibility union for local use and older merge-base checkouts. It is the
# transitive union of the narrow features above, so those lists cannot drift.
profile-bench-selected = []
profile-ci-fp32 = ["profile-bench-selected"]
profile-ci-fp64 = ["profile-bench-selected"]
profile-ci-fp128-base = ["profile-bench-selected"]
profile-ci-multi-group-direct = ["profile-bench-selected"]
profile-ci-multi-group-recursive = ["profile-bench-selected"]
profile-ci-multi-group-recursive-w8r2 = ["profile-bench-selected"]
profile-ci-distributed = ["profile-bench-selected"]
# Compile the profile example with only the singleton adaptive fp128 one-hot
# configuration. Schedule rows remain external artifacts.
profile-onehot-fp128 = []
disk-persistence = [
  "akita-setup/disk-persistence",
  "akita-cpu-backend/disk-persistence",
]
logging-transcript = [
  "akita-transcript/logging-transcript",
  "akita-prover/logging-transcript",
  "akita-cpu-backend/logging-transcript",
]
response-model-diagnostics = ["akita-cpu-backend/response-model-diagnostics"]
compression-weights-crosscheck = ["akita-types/compression-weights-crosscheck"]
# Dev protocol (`docs/branches.md`); see `akita-params`.
dev-protocol = ["akita-params/dev-protocol"]
# Zero knowledge (`specs/whiteout-akita.md` §1.1): `ZkCommitmentConfig`, the
# masked prefix's prover and verifier, and Whiteout's response prover
# (`zk::AkitaResponseProver`). It selects nothing: a zero-knowledge
# configuration does. It compiles no hiding sampler (jolt-zk's `whiteout`
# only), so a hiding commitment fails without `zk-prover`.
zk = [
  "dep:jolt-zk",
  "dep:akita-sumcheck",
  "dep:jolt-poly",
  "dep:zeroize",
  "akita-config/zk",
  "akita-prover/zk",
  "akita-verifier/zk",
  "akita-types/zk",
  "akita-params/zk",
  "akita-cpu-backend/zk",
]
# The zero-knowledge prover's samplers: the OS-drawn hiding randomness and
# jolt-zk's `whiteout-prover`.
zk-prover = ["zk", "jolt-zk/whiteout-prover", "akita-cpu-backend/zk-prover"]
# Test hooks of the zero-knowledge mode (the response prover's unchecked
# path, for the consistent-cheat tests).
test-support = ["zk-prover"]
# Timing harness for examples/compression_dudect.rs: jolt-zk's DIT pool and
# synthetic Σ instance. Diagnostics only; implies `zk-prover` through
# `test-support`.
zk-diagnostics = ["test-support", "jolt-zk/whiteout-diagnostics"]
[dependencies]
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, features = [
  "lattice",
] }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false }
akita-cpu-backend = { version = "0.1.0", path = "../akita-cpu-backend", default-features = false }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-verifier = { version = "0.1.0", path = "../akita-verifier", default-features = false }
akita-prover = { version = "0.1.0", path = "../akita-prover", default-features = false }
akita-setup = { version = "0.1.0", path = "../akita-setup", default-features = false }
tracing = "0.1"
rayon = { version = "1.10", optional = true }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false, optional = true }
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", features = [
  "whiteout",
], optional = true }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, optional = true }
zeroize = { version = "1.8", default-features = false, features = [
  "alloc",
], optional = true }

[dev-dependencies]
# Extension seam: expose existing test diagnostics to grouped integration tests.
# <https://github.com/LayerZero-Labs/akita/issues/285>.
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false, features = [
  "test-support",
  "zk",
] }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false, features = [
  "logging-transcript",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, features = [
  "transcript-blake2b",
  "transcript-keccak",
] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", features = [
  "test-support",
  "whiteout-test-support",
] }
spongefish = { version = "=0.8.0", default-features = false }
# Test-only: pull in `akita-config`'s workspace artifact loader and ring-plan
# seed. Schedule rows remain checked-in external artifacts loaded at runtime.
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
  "zk",
] }
# Test-only: construct zero-knowledge cuts.
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
  "zk",
] }
akita-planner = { version = "0.1.0", path = "../akita-planner", default-features = false, features = [
  "test-support",
  "zk",
] }
# Test-only: the masked prefix of a zero-knowledge opening, both roles.
akita-prover = { version = "0.1.0", path = "../akita-prover", default-features = false, features = [
  "zk",
] }
akita-verifier = { version = "0.1.0", path = "../akita-verifier", default-features = false, features = [
  "zk",
] }
# Test-only: sample the hiding randomness of test schedules that declare it.
akita-cpu-backend = { version = "0.1.0", path = "../akita-cpu-backend", default-features = false, features = [
  "test-support",
  "zk-prover",
] }
akita-schedules = { version = "0.1.0", path = "../akita-schedules", default-features = false, features = [
  "zk",
] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
criterion = { version = "0.8", features = ["html_reports"] }
num-bigint = "0.5.1"
proptest = "1.6"
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra", rev = "3b2a12492cfeb34774a2cdbe9d8d7a869c883fa9", features = [
  "scalar_field",
] }
ark-ff = { git = "https://github.com/arkworks-rs/algebra", rev = "3b2a12492cfeb34774a2cdbe9d8d7a869c883fa9" }
p3-field = "=0.7.0"
p3-mersenne-31 = "=0.7.0"
p3-baby-bear = "=0.7.0"
p3-koala-bear = "=0.7.0"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
libc = "0.2"

[[example]]
name = "profile"
path = "examples/profile/main.rs"

[[test]]
name = "masked_prefix"
required-features = ["test-support"]

[[test]]
name = "zk_end_to_end"
required-features = ["test-support", "logging-transcript"]

[[example]]
name = "zk_distinguisher"
required-features = ["test-support", "logging-transcript"]

[[example]]
name = "zk_response"
required-features = ["zk-prover"]

[[example]]
name = "compression_dudect"
required-features = ["zk-diagnostics"]

[[example]]
name = "binary_source_full_size"
required-features = ["labinius-trinomial"]

[[bench]]
name = "ring_ntt"
harness = false

[[bench]]
name = "field_arith"
harness = false

[[bench]]
name = "akita_e2e"
harness = false

[[bench]]
name = "setup_index_weight"
harness = false

[lints]
workspace = true
