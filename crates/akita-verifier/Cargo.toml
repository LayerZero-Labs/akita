[package]
name = "akita-verifier"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Verifier-facing API surface for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

# `rayon` is consumed through Jolt's conditional-parallel macros, whose
# expansions reference Rayon at the call site.
[package.metadata.cargo-machete]
ignored = ["rayon"]

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "lattice",
] }
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "transcript-blake2b",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
tracing = "0.1"
rayon = { version = "1.10", optional = true }
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", optional = true }

[features]
labinius-trinomial = ["akita-types/labinius-trinomial"]
default = ["transcript-keccak"]
transcript-blake2b = [
  "akita-config/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-types/transcript-blake2b",
  "akita-params/transcript-blake2b",
]
transcript-keccak = [
  "akita-config/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-types/transcript-keccak",
  "akita-params/transcript-keccak",
]
benchmark-support = []
# Test-only views of verifier internals (the masked prefix's batch
# coefficients) for downstream binding probes.
test-support = []
# The masked prefix of a zero-knowledge opening (`specs/whiteout-akita.md`
# §4.5–4.6). It selects nothing: a zero-knowledge configuration does.
zk = [
  "dep:jolt-zk",
  "jolt-zk/whiteout",
  "akita-types/zk",
  "akita-params/zk",
  "akita-config/zk",
]
# Optional (default off): the setup scan's cached structured
# E, T and Z contractions sum their two-factor products through
# `Field::sum_of_products` / `Field::dot_product` (same field values; one
# readout per sum on a field-inline guest). The scan-path kernels are unchanged.
setup-sop-structured = []
parallel = [
  "jolt-poly/parallel",
  "dep:rayon",
  "akita-algebra/parallel",
  "jolt-crypto/parallel",
  "jolt-algebra/parallel",
  "akita-types/parallel",
  "akita-params/parallel",
]

[lints]
workspace = true

[dev-dependencies]
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false, features = [
  "prover",
  "test-support",
] }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
criterion = "0.8"

[[bench]]
name = "relation_evaluator"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "evaluation_trace"
harness = false
required-features = ["benchmark-support"]
