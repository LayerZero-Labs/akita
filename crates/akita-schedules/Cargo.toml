[package]
name = "akita-schedules"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Trusted runtime schedule artifacts and catalogs for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[features]
default = ["transcript-keccak"]
# Extension seam: explicitly selected native roots; https://github.com/LayerZero-Labs/akita/issues/285.
labinius-trinomial = ["dep:jolt-algebra"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-params/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-params/transcript-keccak",
]
# Used only through `#[serde(with = "serde_bytes")]`, which machete cannot see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = [
  "alloc",
] }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, optional = true }

[lints]
workspace = true
