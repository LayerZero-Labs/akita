[package]
name = "akita-schedules"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Trusted runtime schedule artifacts and catalogs for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[features]
# Test-only admission of rows that carry hiding randomness.
test-support = []
zk = ["akita-params/zk"]
[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[lints]
workspace = true
