[package]
name = "akita-schedules"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = [
  "Markos Georghiades <mgeorghiades@a16z.com>",
  "Quang Dao <qvd@andrew.cmu.edu>",
  "Amirhossein Khajehpour <amir.kh@layerzerolabs.org>",
  "Omid Bodaghi <omibo@layerzerolabs.org>",
  "Giuseppe Vitto <giuseppe.vitto@layerzerolabs.org>",
]
license = "Apache-2.0 OR MIT"
description = "Feature-gated generated schedule tables for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[features]
default = ["transcript-blake2b"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-types/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-types/transcript-keccak",
]
all-schedules = [
  "schedules-default",
  "fp128-onehot-recursive",
  "fp128-onehot-recursive-multi-chunk-w8r2",
  "fp128-onehot-multi-chunk",
  "fp128-onehot-multi-chunk-w2r2",
  "fp128-onehot-multi-chunk-w4r2",
  "fp128-dense-multi-chunk",
  "fp128-dense-bounded",
]
schedules-default = [
  "fp128-onehot",
  "fp128-dense",
  "fp32-dense",
  "fp32-onehot",
  "fp64-dense",
  "fp64-onehot",
]
fp128-onehot = []
fp128-dense = []
fp128-onehot-recursive = []
fp128-onehot-recursive-multi-chunk-w8r2 = []
fp128-onehot-multi-chunk = []
fp128-onehot-multi-chunk-w2r2 = []
fp128-onehot-multi-chunk-w4r2 = []
fp128-dense-multi-chunk = []
fp128-dense-bounded = []

fp32-dense = []
fp32-onehot = []
fp64-dense = []
fp64-onehot = []

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }

[lints]
workspace = true
