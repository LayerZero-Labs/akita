[package]
name = "akita-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Shared protocol data types for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
tracing = "0.1"

[features]
test-support = ["akita-params/test-support"]
parallel = [
  "akita-params/parallel",
  "akita-algebra/parallel",
  "jolt-algebra/parallel",
  "jolt-crypto/parallel",
]
labinius-trinomial = ["akita-algebra/labinius-trinomial"]

[dev-dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
] }
criterion = { version = "0.8", features = ["html_reports"] }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "logging",
] }
# Test-only: the masked claim domains the shared stage checks lower into.
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3" }
rand = "0.8"

[[bench]]
name = "golomb_rice"
harness = false

[[bench]]
name = "trinomial_setup"
harness = false
required-features = ["labinius-trinomial"]

[lints]
workspace = true
