[package]
name = "akita-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Shared protocol data types for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9d2eb0f211ae7c35f2c765002e7ece72c1dae424", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9d2eb0f211ae7c35f2c765002e7ece72c1dae424", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9d2eb0f211ae7c35f2c765002e7ece72c1dae424", default-features = false, features = [
  "transcript-blake2b",
] }
serde = { version = "1", features = ["derive"] }
blake2 = "0.11.0"
rand_core = "0.6"
shake = "0.1.0"
tracing = "0.1"

[features]
test-support = ["akita-params/test-support"]
parallel = [
  "akita-params/parallel",
  "akita-algebra/parallel",
  "jolt-field/parallel",
]

[dev-dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
] }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "golomb_rice"
harness = false

[lints]
workspace = true
