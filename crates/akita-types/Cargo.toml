[package]
name = "akita-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Shared protocol data types for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
spongefish = { version = "=0.8.0", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
rand_core = "0.6"
shake = "0.1.0"
tracing = "0.1"
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", optional = true }

[features]
default = ["transcript-keccak"]
test-support = ["akita-params/test-support"]
# The masked channels and the counting replay of a zero-knowledge opening's
# masked levels (`specs/whiteout-akita.md` §4.5).
zk = ["dep:jolt-zk", "akita-error/zk", "akita-params/zk"]
# Prover-side grinding replay, which searches on a copy of the sponge state.
prover = ["akita-transcript/prover"]
transcript-blake2b = [
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-params/transcript-blake2b",
]
transcript-keccak = [
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-params/transcript-keccak",
]
parallel = [
  "akita-params/parallel",
  "akita-algebra/parallel",
  "jolt-algebra/parallel",
  "jolt-crypto/parallel",
]
labinius-trinomial = ["akita-algebra/labinius-trinomial"]
logging-transcript = [
  "akita-params/logging-transcript",
  "akita-transcript/logging-transcript",
]
# Diagnostic: cross-checks every factored compression relation weight
# evaluation against the per-event evaluation and counts the evaluation tiers.
# Native diagnostic builds only; no default feature enables it.
compression-weights-crosscheck = []

[dev-dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
] }
criterion = { version = "0.8", features = ["html_reports"] }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
# Test-only: the masked claim domains the shared stage checks lower into.
jolt-zk = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", features = [
  "test-support",
] }
rand = "0.8"
spongefish = { version = "=0.8.0", default-features = false }

[[bench]]
name = "golomb_rice"
harness = false

[[bench]]
name = "trinomial_setup"
harness = false
required-features = ["labinius-trinomial"]

[lints]
workspace = true
