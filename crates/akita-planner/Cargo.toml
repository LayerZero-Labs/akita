[package]
name = "akita-planner"
autobins = false
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Offline schedule planner for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "0479ea8ad1bd92fb6db7a7d94acedb4c32c0198b", default-features = false }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-config = { version = "0.1.0", path = "../akita-config", optional = true, default-features = false }
akita-schedules = { version = "0.1.0", path = "../akita-schedules", default-features = false }
akita-sis-estimator = { version = "0.1.0", path = "../akita-sis-estimator", default-features = false, optional = true }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", optional = true, default-features = false }
libm = "0.2"
rayon = { version = "1.10", optional = true }

[features]
default = ["transcript-keccak"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-config?/transcript-blake2b",
  "akita-schedules/transcript-blake2b",
  "akita-params/transcript-blake2b",
  "akita-sis-estimator?/transcript-blake2b",
  "akita-types?/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-config?/transcript-keccak",
  "akita-schedules/transcript-keccak",
  "akita-params/transcript-keccak",
  "akita-sis-estimator?/transcript-keccak",
  "akita-types?/transcript-keccak",
]
# Generates every family, the zero-knowledge ones included.
catalog-gen = ["dep:akita-config", "zk", "akita-config/zk"]
catalog-check = ["catalog-gen"]
catalog-security = ["catalog-check", "dep:akita-sis-estimator"]
test-support = []
labinius-trinomial = [
  "dep:akita-types",
  "akita-types/labinius-trinomial",
  "akita-params/labinius-trinomial",
  "akita-schedules/labinius-trinomial",
]
dev-protocol = ["akita-params/dev-protocol"]
# Completes each search state's successors on rayon's pool; the selected
# schedule is the same with or without it.
parallel = ["dep:rayon"]
# Plans zero-knowledge schedules (`find_zk_schedule`) and emits their
# catalogs.
zk = ["akita-params/zk", "akita-schedules/zk"]

[dev-dependencies]
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
] }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
  "zk",
] }

[[bin]]
name = "gen_schedule_artifacts"
path = "src/bin/gen_schedule_artifacts.rs"
required-features = ["catalog-gen"]

[[example]]
name = "mixed_dimension_search"
path = "examples/mixed_dimension_search.rs"
required-features = ["catalog-gen"]

[[example]]
name = "response_plan"
path = "examples/response_plan.rs"
required-features = ["catalog-gen"]

[[example]]
name = "compression_schedule_census"
path = "examples/compression_schedule_census.rs"
required-features = ["catalog-gen"]

[[example]]
name = "catalog_security"
path = "examples/catalog_security.rs"
required-features = ["catalog-security"]

[lints]
workspace = true
