[package]
name = "akita-algebra"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Algebra backends for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
rayon = { version = "1.10", optional = true }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "binary162"
harness = false
required-features = ["labinius-binary"]

[[bench]]
name = "offset_eq_window"
harness = false

[[bench]]
name = "trinomial_ntt"
harness = false
required-features = ["labinius-trinomial"]

[[bench]]
name = "trinomial_limb"
harness = false
required-features = ["labinius-trinomial"]

[[bench]]
name = "ntt_comparison"
harness = false
required-features = ["labinius-trinomial"]

[features]
default = []
labinius-binary = []
parallel = ["jolt-poly/parallel", "dep:rayon", "jolt-algebra/parallel"]
labinius-trinomial = []

tensor-no-carry = []
tensor-eq-runs = []
[lints]
workspace = true
