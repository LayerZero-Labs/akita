[package]
name = "akita-algebra"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Algebra backends for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e290a0d10a30f16dafd4b1ef65f3ebbb497b8f6c", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e290a0d10a30f16dafd4b1ef65f3ebbb497b8f6c", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = { version = "1.10", optional = true }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "crt_ntt_ops"
harness = false

[[bench]]
name = "offset_eq_window"
harness = false

[[bench]]
name = "trinomial_ntt"
harness = false
required-features = ["labinius-trinomial"]

[[bench]]
name = "ntt_comparison"
harness = false
required-features = ["labinius-trinomial"]

[features]
default = []
parallel = ["dep:rayon", "jolt-field/parallel"]
labinius-trinomial = []

[lints]
workspace = true
