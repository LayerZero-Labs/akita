[package]
name = "akita-algebra"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Algebra backends for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-inlines-ntt = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "575dde437f0299b3d942a38cb5da7c0d407ff9c3", default-features = false, optional = true }
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "575dde437f0299b3d942a38cb5da7c0d407ff9c3", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "575dde437f0299b3d942a38cb5da7c0d407ff9c3", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
rand_core = "0.6"
rayon = { version = "1.10", optional = true }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "crt_ntt_ops"
harness = false

[[bench]]
name = "offset_eq_window"
harness = false

[features]
ntt-inline = ["dep:jolt-inlines-ntt"]
default = []
parallel = ["jolt-poly/parallel", "dep:rayon", "jolt-field/parallel"]
tensor-no-carry = []
tensor-eq-runs = []
[lints]
workspace = true
