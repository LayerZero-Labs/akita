[package]
name = "akita-error"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Protocol errors shared by Akita crates"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
thiserror = "2.0"
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false, features = [
  "lattice",
] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "e2e955d41579bc4728c1102e4667fbb5159b03bc", default-features = false }

[features]
# Classify the masked channel's errors (`jolt_zk::masking::ZkError`).
zk = []

[lints]
workspace = true
