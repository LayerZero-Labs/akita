[package]
name = "akita-error"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Protocol errors shared by Akita crates"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
thiserror = "2.0"
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9275c21918cb3927ff9f2d8fdc22f0e802fbdfe4", default-features = false, features = [
  "lattice",
] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "9275c21918cb3927ff9f2d8fdc22f0e802fbdfe4", default-features = false }

[lints]
workspace = true
