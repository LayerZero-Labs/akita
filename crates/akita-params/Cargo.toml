[package]
name = "akita-params"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Parameter geometry and schedules for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", optional = true }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
serde = { version = "1", features = ["derive"] }
blake2 = "0.11.0"
sha3 = "0.12.0"

[features]
labinius-sis = ["dep:akita-challenges", "akita-challenges/labinius-challenges"]
# Selects the dev protocol: every wire-format change `dev` carries that `main`
# does not, together. Off by default. Schedules priced for it live in
# `artifacts/schedules-dev`. See docs/branches.md.
dev-protocol = []
test-support = []
# Whiteout zero-knowledge sizing helpers. Compiles the `zk` module only; it
# selects nothing (docs/branches.md rule 3).
zk = []
parallel = ["akita-algebra/parallel", "jolt-algebra/parallel"]

[dev-dependencies]
num-bigint = "0.5.1"
rand = "0.8"

[lints]
workspace = true
