[package]
name = "akita-params"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Parameter geometry and schedules for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "0479ea8ad1bd92fb6db7a7d94acedb4c32c0198b", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "0479ea8ad1bd92fb6db7a7d94acedb4c32c0198b", default-features = false }
serde = { version = "1", features = ["derive"] }
sha3 = "0.12.0"
keccak = { version = "0.2.2", features = ["parallel"], optional = true }

[features]
labinius-trinomial = ["akita-algebra/labinius-trinomial"]
labinius-sis = ["akita-challenges/labinius-challenges", "dep:keccak"]
# Selects the dev protocol: every wire-format change `dev` carries that `main`
# does not, together. Off by default. Schedules priced for it live in
# `artifacts/schedules-dev`. See docs/branches.md.
dev-protocol = []
default = ["transcript-keccak"]
test-support = []
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
]
parallel = ["akita-algebra/parallel", "jolt-algebra/parallel"]
logging-transcript = ["akita-transcript/logging-transcript"]

[dev-dependencies]
num-bigint = "0.5.1"
rand = "0.8"
shake = "0.1.0"

[lints]
workspace = true
