[package]
name = "akita-params"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Parameter geometry and schedules for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false }
serde = { version = "1", features = ["derive"] }
sha3 = "0.12.0"

[features]
default = ["transcript-keccak"]
test-support = []
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
]
parallel = ["akita-algebra/parallel", "jolt-field/parallel"]
# Keccak-256 instead of SHA3-256 descriptor digests; see `akita-transcript`.
keccak256-digests = ["akita-transcript/keccak256-digests"]
logging-transcript = ["akita-transcript/logging-transcript"]

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
