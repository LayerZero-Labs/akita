[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Challenge sampling for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
serde = { version = "1", features = ["derive"] }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
num-bigint = { version = "0.5.1", optional = true }
shake = { version = "0.1.0", optional = true }
keccak = { version = "0.1.6", features = ["asm"], optional = true }
smallvec = { version = "1.15.2", features = ["const_generics"] }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", branch = "whiteout/preview", default-features = false, features = [
  "lattice",
] }

[dev-dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde_json = "1"
criterion = "0.8"
shake = "0.1.0"
[features]
default = ["transcript-keccak"]
transcript-blake2b = ["akita-transcript/transcript-blake2b"]
transcript-keccak = ["akita-transcript/transcript-keccak"]
parallel = ["jolt-algebra/parallel", "jolt-crypto/parallel"]
logging-transcript = ["akita-transcript/logging-transcript"]
# Prover-only fold-response previews, which copy the public sponge state.
prover = ["akita-transcript/prover"]
labinius-challenges = ["dep:keccak", "dep:num-bigint", "dep:shake"]

# Recursion option (default off): the D64 selective-L2 operator-norm
# table reads its base tables from generated static data (same entries).
ont-static-base = []

[[bench]]
name = "binary_challenge"
harness = false
required-features = ["labinius-challenges"]

[lints]
workspace = true
