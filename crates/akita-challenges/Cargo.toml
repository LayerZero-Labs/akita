[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Challenge sampling for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
serde = { version = "1", features = ["derive"] }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "464267d116f0e2283d3c2f9f074818cbba4d19a5", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
keccak = { version = "0.1.6", features = ["asm"] }
jolt-inlines-keccak256 = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "464267d116f0e2283d3c2f9f074818cbba4d19a5", default-features = false, optional = true }
smallvec = { version = "1.15.2", features = ["const_generics"] }

[dev-dependencies]
shake = "0.1.0"

[features]
default = ["transcript-blake2b"]
transcript-blake2b = ["akita-transcript/transcript-blake2b"]
transcript-keccak = ["akita-transcript/transcript-keccak"]
parallel = ["jolt-field/parallel"]
# Keccak-f[1600] through the jolt-inlines Keccak inline (a RISC-V guest
# verifier); same permutation as the `keccak` crate.
keccak-inline = ["dep:jolt-inlines-keccak256"]
logging-transcript = ["akita-transcript/logging-transcript"]

[lints]
workspace = true
