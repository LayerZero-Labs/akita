[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "The LaBinius binary challenge families"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error", optional = true }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, optional = true }
keccak = { version = "0.1.6", features = ["asm"], optional = true }
num-bigint = { version = "0.5.1", optional = true }
shake = { version = "0.1.0", optional = true }
smallvec = { version = "1.15.2", features = [
  "const_generics",
], optional = true }

[dev-dependencies]
criterion = "0.8"
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
shake = "0.1.0"

[features]
labinius-challenges = [
  "dep:akita-error",
  "dep:jolt-algebra",
  "dep:keccak",
  "dep:num-bigint",
  "dep:shake",
  "dep:smallvec",
]

[[bench]]
name = "binary_challenge"
harness = false
required-features = ["labinius-challenges"]

[lints]
workspace = true
