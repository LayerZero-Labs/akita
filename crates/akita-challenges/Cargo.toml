[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Challenge sampling for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
serde = { version = "1", features = ["derive"] }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1618f4b6dc97effcec3568ca7cf2b7420ac9e75f", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1618f4b6dc97effcec3568ca7cf2b7420ac9e75f", default-features = false, features = [
  "transcript-blake2b",
] }
keccak = { version = "0.1.6", features = ["asm"] }
smallvec = { version = "1.15.2", features = ["const_generics"] }

[dev-dependencies]
shake = "0.1.0"

[features]
parallel = ["jolt-field/parallel"]

[lints]
workspace = true
