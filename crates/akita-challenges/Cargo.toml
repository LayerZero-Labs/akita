[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Challenge sampling for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "8a92941b01488ebe2373b51546395a93fbb94a6e", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "8a92941b01488ebe2373b51546395a93fbb94a6e", default-features = false, features = [
  "lattice",
] }

[features]
default = ["transcript-keccak"]
transcript-blake2b = ["akita-transcript/transcript-blake2b"]
transcript-keccak = ["akita-transcript/transcript-keccak"]
parallel = ["jolt-algebra/parallel", "jolt-crypto/parallel"]
logging-transcript = ["akita-transcript/logging-transcript"]
# Prover-only fold-response previews, which copy the public sponge state.
prover = ["akita-transcript/prover"]

# Recursion option (default off): the D64 selective-L2 operator-norm
# table reads its base tables from generated static data (same entries).
ont-static-base = ["jolt-crypto/ont-static-base"]

[lints]
workspace = true
