[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = [
  "Markos Georghiades <mgeorghiades@a16z.com>",
  "Quang Dao <qvd@andrew.cmu.edu>",
  "Amirhossein Khajehpour <amir.kh@layerzerolabs.org>",
  "Omid Bodaghi <omibo@layerzero.foundation>",
  "Giuseppe Vitto <giuseppe.vitto@layerzerolabs.org>",
]
license = "Apache-2.0 OR MIT"
description = "Challenge sampling for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "ba36f6d53a51d6fb724d5c27fb4b48604975f1a4", default-features = false, features = [
  "solinas",
] }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false }
sha3 = "0.10.8"
smallvec = { version = "1.15.2", features = ["const_generics"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sparse_challenge"
harness = false

[features]
default = ["transcript-blake2b"]
transcript-blake2b = ["akita-transcript/transcript-blake2b"]
transcript-keccak = ["akita-transcript/transcript-keccak"]
parallel = ["jolt-field/parallel"]

[lints]
workspace = true
