[package]
name = "akita-zk-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Prover-side building blocks for zero-knowledge Akita openings"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

# Nothing on the Akita proof path depends on this crate. It holds the
# prover-side pieces of the zero-knowledge extension tracked in
# LayerZero-Labs/akita#120.
[dependencies]
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
rand_core = "0.6"

[dev-dependencies]
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "1976ced1bb8777af51c706c9c2fee15b3de5a10a", default-features = false, features = [
  "solinas",
] }
rand = "0.8"

[lints]
workspace = true
