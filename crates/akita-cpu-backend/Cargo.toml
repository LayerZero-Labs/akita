[package]
name = "akita-cpu-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Owning CPU execution backend for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-prover = { version = "0.1.0", path = "../akita-prover", default-features = false }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
rayon = { version = "1.10", optional = true }
rand_core = "0.6"
tracing = "0.1"

[dev-dependencies]
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false, features = [
  "test-support",
] }
criterion = { version = "0.8", features = ["html_reports"] }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
rand = "0.8"
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false, features = [
  "test-support",
] }
# Test-only: `relation_tests` checks prover relation witnesses against the
# verifier's setup-contribution evaluators. Never a normal dependency; the
# `parallel` feature below forwards to it only in test builds.
akita-verifier = { version = "0.1.0", path = "../akita-verifier", default-features = false }

[features]
response-model-diagnostics = ["akita-prover/response-model-diagnostics"]
disk-persistence = []
# Whiteout hiding randomness: samples the randomness columns of schedules that
# declare them. Selects nothing; clear schedules never sample.
zk = ["jolt-crypto/sample", "rand_core/getrandom", "akita-params/zk"]
# Seeded hiding randomness for reproducible tests. Never enabled outside tests.
test-support = []
labinius-trinomial = [
  "akita-algebra/labinius-trinomial",
  "akita-types/labinius-trinomial",
]
parallel = [
  "akita-prover/parallel",
  "dep:rayon",
  "jolt-crypto/parallel",
  "jolt-algebra/parallel",
  "akita-sumcheck/parallel",
  "akita-types/parallel",
  "akita-params/parallel",
  "akita-verifier/parallel",
]

[[bench]]
name = "ntt_matvec"
harness = false

[[bench]]
name = "coefficient_packing"
harness = false

[[bench]]
name = "decompose_fold"
harness = false

[[bench]]
name = "root_kernels"
harness = false

[[bench]]
name = "trinomial_relation"
harness = false
required-features = ["labinius-trinomial"]

[[bench]]
name = "quotient_kernels"
harness = false

[lints]
workspace = true
