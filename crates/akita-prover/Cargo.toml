[package]
name = "akita-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Prover-facing APIs for the Akita polynomial commitment scheme"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false, features = [
  "prover",
] }
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "13e1491953982c0c35b76717e21ca4f9d43f6ded", default-features = false, features = [
  "asm",
  "solinas",
] }
jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "13e1491953982c0c35b76717e21ca4f9d43f6ded", default-features = false }
akita-serialization = { version = "0.1.0", path = "../akita-serialization" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
akita-transcript = { version = "0.1.0", path = "../akita-transcript", default-features = false, features = [
  "prover",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false, features = [
  "prover",
] }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
tracing = "0.1"

[dev-dependencies]
akita-config = { version = "0.1.0", path = "../akita-config", default-features = false, features = [
  "test-support",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false, features = [
  "test-support",
] }

[features]
default = ["transcript-keccak"]
transcript-blake2b = [
  "akita-challenges/transcript-blake2b",
  "akita-config/transcript-blake2b",
  "akita-sumcheck/transcript-blake2b",
  "akita-transcript/transcript-blake2b",
  "akita-types/transcript-blake2b",
  "akita-params/transcript-blake2b",
]
transcript-keccak = [
  "akita-challenges/transcript-keccak",
  "akita-config/transcript-keccak",
  "akita-sumcheck/transcript-keccak",
  "akita-transcript/transcript-keccak",
  "akita-types/transcript-keccak",
  "akita-params/transcript-keccak",
]
logging-transcript = [
  "akita-challenges/logging-transcript",
  "akita-transcript/logging-transcript",
  "akita-types/logging-transcript",
  "akita-params/logging-transcript",
]
response-model-diagnostics = []
parallel = [
  "akita-challenges/parallel",
  "akita-transcript/parallel",
  "jolt-field/parallel",
  "akita-sumcheck/parallel",
  "akita-types/parallel",
  "akita-params/parallel",
]

[lints]
workspace = true
